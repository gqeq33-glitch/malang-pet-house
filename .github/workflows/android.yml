# 안드로이드 앱 빌드 (클라우드). PC에 Android Studio 없이도 GitHub가 APK/AAB를 만들어 준다.
# - 언제나: 테스트용 app-debug.apk (폰에 바로 설치 가능)
# - 저장소 Secrets에 서명키 4개가 있으면: 구글 플레이 업로드용 app-release.aab
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'tests/**', 'tools/check_release.js', 'tools/smoke_test.js', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1) 잠금 파일 그대로 설치 → 2) 자동 시험 → 3) 필수 파일·문법·모델 점검 → 4) 브라우저 첫 화면 시험
      #    하나라도 실패하면 여기서 멈추고 앱을 만들지 않는다
      - name: Install packages (lockfile)
        run: npm ci

      - name: Tests
        run: npm test

      - name: Release checks (files, syntax, models)
        run: node tools/check_release.js

      - name: Browser smoke test
        run: node tools/smoke_test.js

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "#DDF4EA" --splashBackgroundColor "#DDF4EA"
          npx cap sync android
          # 안드로이드 11 이상에서 기기 음성(TTS) 엔진을 찾으려면 필요하다
          grep -q 'TTS_SERVICE' android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          # 플레이 스토어는 업데이트마다 versionCode가 커져야 하므로 빌드 번호를 쓴다
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: malang-pet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          npx cap build android \
            --keystorepath "$RUNNER_TEMP/upload.jks" \
            --keystorepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --keystorealias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --keystorealiaspass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --androidreleasetype AAB

      - uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: malang-pet-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
