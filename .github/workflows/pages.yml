# www 폴더를 GitHub Pages(https)에 올린다. https 주소가 있어야 폰에서 "앱 설치/홈 화면에 추가"가 된다.
name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
