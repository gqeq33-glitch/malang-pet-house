    card.innerHTML = `<h3>${goal ? '🏁 골인!' : '조금만 더!'}</h3><div class="big-score">⭐ ${g.score}</div><p>${isBest && g.score ? '🏆 새 최고 기록!' : `최고 기록 ${prev}`}${goal ? '<br>60초를 끝까지 달렸어요!' : `<br>${Math.floor(g.time)}초 달렸어요`}</p><p>${coins ? `<i class="coin"></i> ${coins}코인 · ` : ''}행복 +20</p><div style="display:flex;gap:8px"><button class="candy primary" id="rnAgain" style="flex:1">한 번 더</button><button class="candy" id="gHome" style="flex:1">돌아가기</button></div>`;
    wrap.appendChild(card);
    card.querySelector('#gHome').addEventListener('click', closeGame);
    card.querySelector('#rnAgain').addEventListener('click', () => { closeGame(); openRunner(); });
    card.querySelector('#rnAgain').focus({ preventScroll: true });
  }
  function closeGame() {
    gameOn = false;
    window.removeEventListener('resize', size); window.removeEventListener('keydown', kd);
    wrap.remove(); try { rd.forceContextLoss(); rd.dispose(); } catch (e) {}
    setMood('happy', 1500); say('달리기 재밌었어요! 잠깐 쉬어도 좋아요.'); render();
    if (backFocus?.isConnected) backFocus.focus(); else $('#world').focus({ preventScroll: true });
  }
  wrap.querySelector('#gStart').addEventListener('click', () => { wrap.querySelector('#gCard').remove(); g.run = true; sfx('pop'); wrap.querySelector('#gClose').focus({ preventScroll: true }); });
  wrap.querySelector('#gClose').addEventListener('click', () => { if (g.run && g.score > 0) finish(false); else closeGame(); });
  wrap.addEventListener('keydown', trapTab);
  wrap.querySelector('#gStart').focus({ preventScroll: true });
  requestAnimationFrame(loop);
}

function openPlayMenu() {
  const p = P(), best = S.best || {};
  if (p.energy < 15) return say('너무 졸려서 못 놀겠어요… 먼저 재워 주세요');
  const card = (id, emoji, title, desc, cls = '') =>
    `<button class="dex-card" data-game="${id}"><span class="emo ${cls}">${emoji}</span><span class="txt"><span class="t1">${title}</span><br><span class="t2">${desc}</span></span><span class="go">${best[id] ? `최고 ${best[id]}` : '해 보기'}</span></button>`;
  openSheet('뭐 하고 놀까?', `<div class="dex">
    <p class="arcade-head" style="margin-top:0">영어 배우기 <span class="arcade-tag">레벨 올리고 선물 받기</span></p>
    <button class="dex-card" data-game="english"><span class="emo day">📚</span><span class="txt"><span class="t1">말랑 영어</span><br><span class="t2">듣고, 고르고, 써 보며 배워요</span></span><span class="go">시작 ▶</span></button>
    <button class="dex-card" data-game="saga"><span class="emo day">📖</span><span class="txt"><span class="t1">이야기 모험</span><br><span class="t2">친구들과 말 나무를 살려요 (8장)</span></span><span class="go">시작 ▶</span></button>
    <button class="dex-card" data-game="enggames"><span class="emo day">🎮</span><span class="txt"><span class="t1">영어 게임</span><br><span class="t2">알파벳, 카드, 문장 기차, 펫 카페, 정글, 이야기 극장 등 9종</span></span><span class="go">시작 ▶</span></button>
    <p class="arcade-head">새 놀이 <span class="arcade-tag">휴대폰으로 슥슥</span></p>
    ${card('runner', '🏃', '말랑 달리기', '좌우로 밀어 피하고, 위로 밀어 점프! 60초 달리기', 'day')}
    <p class="arcade-head">친구랑 같이 <span class="arcade-tag">한 화면에서 둘이</span></p>
    ${card('duoTag', '🏃', '둘이 술래잡기', '번갈아 술래! 오래 버틴 쪽이 이겨요', 'day')}
    ${card('duoTreasure', '🎁', '둘이 보물 대결', '상자 12개를 누가 더 많이 주울까?', 'day')}
    ${card('pals', '🤝', '친구 코드', '친구 펫을 내 마을에 초대하고 코스 기록으로 겨뤄요', 'day')}
    <p class="arcade-head">마을 놀이 <span class="arcade-tag">직접 달려요</span></p>
    ${card('tag', '🏃', '술래잡기', '내가 술래! 도망가는 친구 3명을 45초 안에 잡아요', 'day')}
    ${card('treasure', '🎁', '보물찾기', '마을에 숨은 선물 상자 8개를 45초 안에 찾아요', 'day')}
    <p class="arcade-head">미니게임</p>
    ${card('stars', '⭐', '별똥별 받기', '떨어지는 별과 하트를 받아요. 30초 동안!', 'day')}
    <p class="arcade-head">추억의 오락실 <span class="arcade-tag">엄마 아빠 어릴 적 오락실 느낌</span></p>
    ${Object.values(ARCADE).map(d => card(d.id, d.emo, d.title, d.desc)).join('')}
  </div>`, body => body.addEventListener('click', e => {
    const b = e.target.closest('[data-game]'); if (!b) return;
    closeSheet();
    if (b.dataset.game === 'english') return openEnglish();
    if (b.dataset.game === 'enggames') return openEngGames();
    if (b.dataset.game === 'saga') return openSaga();
    if (b.dataset.game === 'runner') return openRunner();
    if (b.dataset.game === 'duoTag' || b.dataset.game === 'duoTreasure') return openDuoSetup(b.dataset.game);
    if (b.dataset.game === 'pals') return openPals();
    if (b.dataset.game === 'tag' || b.dataset.game === 'treasure') return startRound(b.dataset.game);
    return b.dataset.game === 'stars' ? openGame() : openArcade(ARCADE[b.dataset.game]);
  }));
}

function openArcade(def) {
  const p = P();
  if (p.energy < 15) return say('너무 졸려서 못 놀겠어요… 먼저 재워 주세요');
  if (p.hunger < 12) return say('배가 고파서 힘이 없어요…');
  gameOn = true;
  const backFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  const img = petImages(p);
  const wrap = document.createElement('div'); wrap.id = 'game'; wrap.className = 'arcade';
  wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true'); wrap.setAttribute('aria-label', def.title);
  const padBtn = (k, label, area) => def.pads.includes(k) ? `<button class="pbtn" data-k="${k}" style="grid-area:${area}" aria-label="${label}">${label}</button>` : '';
  wrap.innerHTML = `<div class="g-top gut"><span class="ttl">${def.emo} ${def.title}</span><span class="pill">점수 <span id="aScore">0</span></span><span class="pill" id="aLives">♥♥♥</span><button class="icon-btn" id="gClose" aria-label="그만하기">✕</button></div>
    <div class="a-stage"><canvas id="aCanvas"></canvas></div>
    <div class="pad gut"><div class="dpad">${padBtn('up', '▲', '1 / 2')}${padBtn('left', '◀', '2 / 1')}${padBtn('down', '▼', '2 / 2')}${padBtn('right', '▶', '2 / 3')}</div><button class="abtn" data-k="a">${def.aLabel}</button></div>
    <div class="g-card" id="gCard"><h3>${def.emo} ${def.title}</h3><p>${def.howto}</p><p class="fine">키보드: 방향키 + 스페이스바</p><button class="candy primary" id="gStart">시작!</button></div>`;
  $('#app').appendChild(wrap);
  pushBack();

  // 터치 패드 + 키보드 → 하나의 입력 상태. aPressed/upPressed는 누른 순간 한 프레임만 켜진다
  const inp = { left: false, right: false, up: false, down: false, a: false, aPressed: false, upPressed: false };
  const press = (k, on) => { if (on && !inp[k]) { if (k === 'a') inp.aPressed = true; if (k === 'up') inp.upPressed = true; } inp[k] = on; };
  wrap.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); press(k, true); b.classList.add('on'); });
    const up = () => { press(k, false); b.classList.remove('on'); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, up));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', ' ': 'a', z: 'a', Z: 'a' };
  const kd = e => { const k = KEYS[e.key]; if (!k || !gameOn) return; e.preventDefault(); press(k, e.type === 'keydown'); };
  window.addEventListener('keydown', kd); window.addEventListener('keyup', kd);

  const cv = wrap.querySelector('#aCanvas'), ctx = cv.getContext('2d'), stage = wrap.querySelector('.a-stage');
  function fit() {
    const s = Math.max(.5, Math.min((stage.clientWidth - 16) / AW, (stage.clientHeight - 16) / AH));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = AW * s + 'px'; cv.style.height = AH * s + 'px';
    cv.width = Math.round(AW * s * dpr); cv.height = Math.round(AH * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  fit(); window.addEventListener('resize', fit);

  let g;
  const reset = () => { g = { score: 0, lives: 3, t: 0, over: false, win: false, run: false, last: 0, banner: '', bannerT: 0, fx: [] }; def.init(g); };
  reset();
  function loop(t) {
    if (!gameOn) return;
    const dt = Math.min(.05, (t - (g.last || t)) / 1000); g.last = t;
    if (g.run) {
      g.t += dt; def.update(g, dt, inp);
      g.bannerT = Math.max(0, g.bannerT - dt);
      for (const f of g.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.t -= dt; }
      g.fx = g.fx.filter(f => f.t > 0);
    }
    inp.aPressed = false; inp.upPressed = false;
    def.draw(ctx, g, img);
    for (const f of g.fx) { ctx.globalAlpha = Math.min(1, f.t * 2); ctx.fillStyle = f.c; ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3); }
    ctx.globalAlpha = 1;
    if (g.bannerT > 0) {
      ctx.font = '24px Jua, "Gowun Dodum", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeText(g.banner, AW / 2, AH * .42);
      ctx.fillStyle = '#FFE27A'; ctx.fillText(g.banner, AW / 2, AH * .42);
    }
    $('#aScore').textContent = g.score;
    $('#aLives').textContent = '♥'.repeat(Math.max(0, g.lives)) || '♡';
    if (g.run && g.over) { g.run = false; return finish(); }
    requestAnimationFrame(loop);
  }
  function finish() {
    const coins = Math.floor(g.score / 10) + (g.win ? 10 : 0), xp = Math.ceil(g.score / 25) + 5;
    S.coins += coins; change({ fun: 25, energy: -15, hunger: -8 }); addXP(xp);
    mission('play'); if (g.score >= 200) mission('score'); if (g.score >= 300) badge('arcade');
    const isBest = g.score > (S.best[def.id] || 0);
    if (isBest) S.best[def.id] = g.score;
    persist(); sfx(g.win ? 'up' : 'coin');
    if (g.win) confetti(60);
    const msg = g.win ? '끝판까지 해냈어요!' : g.score >= 400 ? '정말 잘했어요!' : '함께해서 즐거웠어요!';
    const card = document.createElement('div'); card.className = 'g-card';
    card.innerHTML = `<h3>${msg}</h3><div class="big-score">${g.score}</div><p>${isBest && g.score ? '🏆 새 최고 기록!' : `최고 기록 ${S.best[def.id] || 0}`}</p><p><i class="coin"></i> ${coins}코인 · 경험치 ${xp} · 행복 +25</p><button class="candy primary" id="gHome">방으로 돌아가기</button>`;
    wrap.appendChild(card);
    card.querySelector('#gHome').addEventListener('click', closeGame);
    card.querySelector('#gHome').focus({ preventScroll: true });
  }
  function closeGame() {
    gameOn = false;
    window.removeEventListener('resize', fit); window.removeEventListener('keydown', kd); window.removeEventListener('keyup', kd);
    wrap.remove(); setMood('happy', 1500); say('재미있게 놀았어요! 잠깐 쉬어도 좋아요.'); render();
    if (backFocus?.isConnected) backFocus.focus(); else $('#world').focus({ preventScroll: true });
  }
  wrap.querySelector('#gStart').addEventListener('click', () => { wrap.querySelector('#gCard').remove(); g.run = true; sfx('pop'); wrap.querySelector('#gClose').focus({ preventScroll: true }); });
  wrap.querySelector('#gClose').addEventListener('click', () => { if (g.run && g.score > 0) { g.over = true; } else closeGame(); });
  wrap.addEventListener('keydown', trapTab);
  wrap.querySelector('#gStart').focus({ preventScroll: true });
  requestAnimationFrame(loop);
}

/* =========================================================
   12. 버튼 연결
   ========================================================= */
$('#actions').addEventListener('click', e => {
  const b = e.target.closest('.act'); if (!b || b.disabled) return;
  sfx('tap');
  const p = P();
  if (World.area() === 'village' && (b.dataset.act === 'bath' || b.dataset.act === 'sleep')) {
    if (talking) closeTalk();
    say('집에 가서 할래요!', 2500);
    return World.goHome(() => b.dataset.act === 'bath' ? startBath() : sleep());
  }
  if (talking) closeTalk();
  switch (b.dataset.act) {
    case 'feed': return openFeed();
    case 'play': return openPlayMenu();
    case 'bath': return bathing ? endBath() : startBath();
    case 'sleep': return p.asleep ? wake(false) : sleep();
    case 'shop': return openShop();
    case 'dex': return openDex();
  }
});
$('#settingsBtn').addEventListener('click', () => { sfx('tap'); openSettings(); });
$('#missionBtn').addEventListener('click', () => { sfx('tap'); openMissions(); });

/* =========================================================
   13. 시작(입양) 화면
   ========================================================= */
let chosen = 'bear';
function renderPick() {
  const s = SPECIES[chosen];
  $('#pickBig').innerHTML = petSVG(chosen, { mood: 'happy', stage: 'kid' });
  $('#pickName').textContent = s.name;
  $('#pickKind').textContent = s.kind;
  $('#pickDesc').textContent = s.desc;
  $('.pick-stage').style.background = s.bg;
  $('#nameInput').placeholder = s.name;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.sp === chosen));
}
function showStart() {
  $('#start').hidden = false; $('#home').hidden = true;
  $('#chips').innerHTML = START_SPECIES.map(sp => `<button class="chip" data-sp="${sp}" aria-label="${SPECIES[sp].name}" style="--chip:${SPECIES[sp].color};--chipbg:${SPECIES[sp].bg}">${petSVG(sp, { stage: 'kid' })}</button>`).join('');
  $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { chosen = c.dataset.sp; sfx('pop'); renderPick(); } });
  renderPick();
}
$('#startBtn').addEventListener('click', () => {
  const name = cleanName($('#nameInput').value, SPECIES[chosen].name);
  S.pets.push(newPet(chosen, name)); S.active = 0; S.lastTick = Date.now();
  S.tut = { step: 'egg', t0: Date.now() };
  persist(); sfx('hatch'); showHome();
  setTimeout(() => chapterBanner(CHAPTERS[1], CH_SUB[1]), 700);
  say(idleLine(), 9000);
});

let worldReady = false;
function showHome() {
  $('#start').hidden = true; $('#home').hidden = false;
  buildStats();
  if (!worldReady) { World.init(); worldReady = true; World.setDecor(decorState().placed); World.setGarden(farm().plots); World.setEvent(!!SEASON); spawnStickers(); syncPals(); }
  render();
}

/* =========================================================
   14. 시간 흐름 + 부팅
   ========================================================= */
function tick() {
  const now = Date.now();
  const mins = (now - S.lastTick) / 60000;
  S.lastTick = now;
  if (mins > 0 && S.pets.length) decayAll(mins);
  growFarm(); weatherTick();
  if (P()) render();
}
let saveCount = 0;
// 저장 때문에 시작하다 멈추면 저장을 덮어쓰지 않고 복구 화면을 보여 준다
function bootFail(err) {
  restoring = true;   // 깨진 상태를 저장하지 않는다
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); if (raw) localStorage.setItem(SAVE_KEY + '-invalid', raw); } catch (e) {}
  const el = document.createElement('div'); el.className = 'gate-wrap'; el.id = 'bootFail';
  const card = document.createElement('div'); card.className = 'g-card'; card.setAttribute('role', 'alertdialog'); card.setAttribute('aria-labelledby', 'bootT');
  const title = document.createElement('h3'); title.id = 'bootT'; title.textContent = '기록을 여는 데 문제가 생겼어요';
  const note = document.createElement('p'); note.textContent = '기록은 지우지 않고 기기에 보관해 두었어요. 어른과 함께 아래에서 골라 주세요.';
  card.append(title, note);
  const btn = (text, fn, cls = 'candy') => { const b = document.createElement('button'); b.className = cls; b.style.cssText = 'width:100%;margin-top:8px'; b.textContent = text; b.addEventListener('click', fn); card.append(b); return b; };
  btn('다시 시도하기', () => location.reload(), 'candy primary');
  if (hasBeforeRestore()) btn('복원하기 바로 전 기록으로 되돌리기', undoRestore);
  btn('새로 시작하기 (보관한 기록은 남겨 둬요)', () => parentGate(() => {
    try { if (raw) localStorage.setItem(SAVE_KEY + '-reset-backup', raw); localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }));
  el.append(card); $('#app').appendChild(el);
}
function start(hotData) {
  try {
    S = (hotData && hotData.v === 1 && Array.isArray(hotData.pets)) ? hotData : (load() || freshSave());
    S.best = S.best || {};
    S.story = S.story || { i: 0, prog: 0 };
    S.parent = Object.assign({ limit: 60, breakEvery: 30, bedtime: true }, S.parent);
    if (S.pets.length && !S.tut) S.tut = { step: 'done', old: true };   // 이미 하던 저장은 튜토리얼 없이, 열린 곳을 닫지 않는다
    qaState();
    if (!S.pets.length) { showStart(); }
    else {
      const away = (Date.now() - S.lastTick) / 60000;
      showHome(); tick(); storyCatchUpOnLoad();
      const p = P();
      say(idleLine(), 7000);
      // 영어가 이 게임의 중심: 켜면 영어 지도부터 보여 준다. 닫으면 바로 펫 놀이를 할 수 있다
      if (p.hatched) setTimeout(() => { if (!scrim && !gameOn && !restOpen && !talking && !bathing) openEnglish(); }, 1500);
    }
    showRestoreNote();
  } catch (err) { bootFail(err); return; }
  setInterval(() => { if (!S.pets.length) return; tick(); playTick(); if (++saveCount % 10 === 0) persist(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (S.pets.length) { tick(); persist(); } });
  window.addEventListener('pagehide', persist);
}
if ('serviceWorker' in navigator && !window.Capacitor && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
})();
</script>
