<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>말랑 펫하우스</title>
<meta name="description" content="오리지널 말랑 친구를 알에서 부화시켜 돌보는 어린이 펫 키우기 게임">
<meta name="theme-color" content="#DDF4EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말랑펫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>말랑 펫하우스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
@font-face{font-family:"Jua";src:url("fonts/Jua-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url("fonts/GowunDodum-Regular.woff2") format("woff2");font-display:swap}
/* Layout: 폰 한 화면 앱. 위 = 이름·코인·상태 막대, 가운데 = 펫이 사는 방(무대), 아래 = 엄지로 누르는 큰 사탕 버튼 6개 */
:root{
  --wall:#DDF4EA;      /* 민트 벽지 */
  --mint:#7ED9C3;
  --butter:#FFE27A;
  --coral:#FF8FA3;
  --ink:#5B4550;       /* 코코아 잉크: 캐릭터 외곽선과 글자 */
  --paper:#FFFFFF;
  --soft:#F4FBF8;
  --line:#EADDE3;
  --muted:#8E7A85;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;overscroll-behavior:none}
body{background:#CDEFE2 radial-gradient(#B9E5D3 1.6px,transparent 1.8px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #4BB8A0;outline-offset:2px}
#app{position:relative;height:100%;padding-top:env(safe-area-inset-top,0px);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--wall);overflow:hidden;box-shadow:0 0 0 2px #BFE3D4,0 24px 60px rgba(91,69,80,.18)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 공통 사탕 버튼 ---------- */
.candy{border:0;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 #D9C9D1,0 0 0 2.5px var(--ink) inset;padding:10px 14px;font-family:var(--display);font-size:17px;transition:transform .08s}
.candy:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9D1,0 0 0 2.5px var(--ink) inset}
.candy.primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 #D9667C,0 0 0 2.5px var(--ink) inset;text-shadow:0 1px 0 rgba(91,69,80,.35)}
.candy.primary:active{box-shadow:0 1px 0 #D9667C,0 0 0 2.5px var(--ink) inset}
.candy:disabled{opacity:.45;cursor:default;transform:none}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0 0 18%,#FFD54F 20% 62%,#F2B623 64%);box-shadow:0 0 0 1.5px var(--ink);vertical-align:-.12em}

/* ---------- 시작(입양) 화면 ---------- */
#start{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:22px 18px;overflow-y:auto}
.logo{font-family:var(--display);font-size:42px;line-height:1;text-align:center;letter-spacing:-.01em;margin:4px 0 0;color:var(--ink);text-wrap:balance}
.logo b{color:var(--coral);font-weight:400}
.tag{text-align:center;margin:0;color:var(--muted)}
.pick-stage{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 0 0 2.5px var(--ink) inset,0 6px 0 #C4E6D8;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick-stage .big{width:min(58vw,210px);aspect-ratio:1;max-width:100%}
.pick-stage .big svg{width:100%;height:100%;animation:hop 1.6s ease-in-out infinite;transform-origin:50% 95%}
.pick-name{font-family:var(--display);font-size:28px;margin:0}
.pick-kind{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);box-shadow:0 0 0 1.5px var(--line) inset}
.pick-desc{margin:6px 0 0;text-align:center;line-height:1.55;max-width:32ch;text-wrap:pretty}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-width:0;border:0;background:var(--paper);border-radius:18px;aspect-ratio:1;padding:4px;box-shadow:0 0 0 2px var(--line) inset;transition:transform .15s}
.chip svg{width:100%;height:100%}
.chip[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink) inset,0 4px 0 var(--chip,#ccc);transform:translateY(-3px);background:var(--chipbg,#fff)}
.name-row{display:flex;gap:8px;align-items:center}
.name-row label{font-family:var(--display);font-size:16px;white-space:nowrap}
.name-row input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:14px;border:0;box-shadow:0 0 0 2.5px var(--ink) inset;background:var(--paper);color:var(--ink);user-select:text}
#startBtn{font-size:21px;padding:14px}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* ---------- 방 화면 ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding-block:12px 6px}
.who{flex:1;min-width:0}
.who h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:3px}
.lv b{font-family:var(--display);font-weight:400;font-size:13px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px}
.xp{flex:1;max-width:120px;height:7px;border-radius:9px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);overflow:hidden}
.xp i{display:block;height:100%;background:var(--butter);width:0;transition:width .4s}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:17px;padding:6px 12px;border-radius:99px;background:var(--paper);box-shadow:0 0 0 2px var(--ink) inset;font-variant-numeric:tabular-nums}
.icon-btn{border:0;width:40px;height:40px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--ink) inset;font-size:19px;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding-block:4px 10px}
.stat{display:flex;align-items:center;gap:6px;font-size:13px}
.stat span{width:4.6em;white-space:nowrap}
.bar{flex:1;height:12px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:9px;background:var(--c);transition:width .5s}
.stat.low .bar{animation:blinkbar 1s steps(2) infinite}

.room{position:relative;flex:1;min-height:240px;overflow:hidden;border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);background:#BFE8FF;touch-action:none}
.room.bathing{cursor:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.room-tabs{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:6px;z-index:6;padding-inline:8px;flex-wrap:wrap;pointer-events:none}
.room-tabs button{pointer-events:auto;border:0;border-radius:99px;padding:5px 11px;font-family:var(--display);font-size:14px;background:rgba(255,255,255,.88);box-shadow:0 0 0 2px var(--ink) inset,0 2px 0 rgba(91,69,80,.25)}
.room-tabs button.on{background:var(--butter)}
.room-tabs button:disabled{opacity:.45}
.pet2d{position:absolute;left:50%;bottom:8%;width:min(60%,240px);aspect-ratio:1;transform:translateX(-50%)}
.pet2d svg{width:100%;height:100%}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0 30%,rgba(255,246,200,.85) 60%,rgba(255,255,255,0) 100%);opacity:0;pointer-events:none;z-index:7}
.flash.go{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.tags{position:absolute;inset:0;pointer-events:none;z-index:4}
.quest{position:absolute;left:66px;right:10px;bottom:10px;z-index:6;display:flex;align-items:center;gap:8px;border:0;text-align:left;background:rgba(255,255,255,.95);border-radius:16px;padding:7px 8px 7px 12px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(91,69,80,.25);color:var(--ink)}
.q-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.q-ch{font-size:11px;color:var(--muted)}
.q-tx b{font-family:var(--display);font-weight:400;font-size:15px}
.q-tx em{font-style:normal;color:#E8476A;font-variant-numeric:tabular-nums}
.q-go{flex:none;font-family:var(--display);font-size:14px;background:var(--butter);border-radius:10px;padding:6px 10px;box-shadow:0 0 0 2px var(--ink) inset;white-space:nowrap}
.chapter{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:9;text-align:center;background:var(--paper);border-radius:22px;padding:14px 22px;box-shadow:0 0 0 3px var(--ink) inset,0 6px 0 rgba(91,69,80,.25);animation:popin .45s cubic-bezier(.3,1.7,.5,1);display:flex;flex-direction:column;gap:2px;pointer-events:none;min-width:220px}
.chapter b{font-family:var(--display);font-weight:400;font-size:26px}
.chapter span{font-size:14px;color:var(--muted)}
.ev-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.swatch.dye{width:56px;height:56px;border-radius:50%}
.emote-btn{position:absolute;left:10px;bottom:10px;z-index:6;width:48px;height:48px;border-radius:50%;border:0;font-size:26px;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(91,69,80,.25)}
.emote-tray{position:absolute;left:10px;bottom:66px;z-index:7;display:flex;gap:6px;background:var(--paper);border-radius:18px;padding:6px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(91,69,80,.2)}
.emote-tray button{border:0;background:var(--soft);border-radius:12px;width:52px;padding:6px 0 4px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:1px}
.emote-tray small{font-family:var(--display);font-size:11px}
.cook-btn{width:100%;margin-bottom:12px;background:#FFE0C7}
.pantry{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pan{font-family:var(--display);font-size:15px;background:var(--soft);border-radius:99px;padding:4px 10px;box-shadow:0 0 0 2px var(--line) inset;font-variant-numeric:tabular-nums}
.item.off{opacity:.45}
.pot{font-size:64px;line-height:1.1}
.pot.stir{animation:wobble .35s ease}
.obby-ui{position:absolute;inset:0;z-index:8;pointer-events:none}
.ob-top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;justify-content:flex-end;pointer-events:auto}
.ob-top .pill{font-size:15px;padding:5px 10px;background:rgba(255,255,255,.92)}
.ob-tip{position:absolute;top:60px;left:16px;right:16px;margin:0;text-align:center;font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.joy{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(91,69,80,.55) inset;pointer-events:auto;touch-action:none;display:grid;place-items:center}
.joy i{width:56px;height:56px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--ink) inset,0 4px 0 rgba(91,69,80,.3)}
.jump-btn{position:absolute;right:18px;bottom:24px;width:110px;height:110px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 6px 0 #B54A60,0 0 0 4px #fff inset;pointer-events:auto;touch-action:none}
.jump-btn.on{transform:translateY(4px);box-shadow:0 2px 0 #B54A60,0 0 0 4px #fff inset}
#obResult{z-index:9}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.badge-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:var(--soft);border-radius:18px;padding:10px 6px;box-shadow:0 0 0 2px var(--line) inset;opacity:.6}
.badge-card.got{opacity:1;background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset}
.badge-card .be{font-size:32px}
.badge-card b{font-family:var(--display);font-weight:400;font-size:14px}
.badge-card small{font-size:11px;color:var(--muted);line-height:1.35}
.mbtn{position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#E8476A;color:#fff;font-size:11px;font-family:var(--display);display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.msub{margin:0 0 10px;color:var(--muted);font-size:13px}
.missions{display:grid;gap:8px}
.mission{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:10px 12px;box-shadow:0 0 0 2px var(--line) inset}
.mission.done{background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset}
.mission.bonus{margin-top:10px}
.mi{font-size:26px;flex:none}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt b{font-weight:400;font-family:var(--display);font-size:15px}
.mt small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{height:8px;border-radius:9px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--mint)}
.mission .candy{padding:6px 10px;font-size:14px;white-space:nowrap;flex:none}
.mclaimed{font-family:var(--display);font-size:13px;color:#2FA36B;flex:none}
.dbtns{display:flex;gap:4px}
.mini-btn{border:0;border-radius:10px;padding:4px 9px;font-family:var(--display);font-size:13px;background:#fff;box-shadow:0 0 0 2px var(--ink) inset}
.mini-btn.buy{background:var(--butter)}
.place-bar{position:absolute;left:8px;right:8px;bottom:10px;z-index:7;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(91,69,80,.2);font-size:14px}
.place-bar span{flex:1;min-width:0}
.place-bar .candy{padding:6px 12px;font-size:15px;flex:none}
.set-list{display:grid;gap:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;border:0;width:100%;text-align:left;background:var(--soft);border-radius:16px;padding:14px 16px;font-size:16px;box-shadow:0 0 0 2px var(--line) inset}
.set-row b{font-family:var(--display);font-weight:400}
.parent h4{font-family:var(--display);font-weight:400;font-size:16px;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:14px;background:var(--soft);box-shadow:0 0 0 2px var(--line) inset}
.seg button.on{background:var(--butter);box-shadow:0 0 0 2.5px var(--ink) inset}
.rest{position:absolute;inset:0;z-index:100;background:linear-gradient(#3B3F86,#6E5BA8);display:grid;place-items:center;padding:20px;animation:fade .4s}
.rest-card{background:var(--paper);border-radius:28px;padding:22px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 0 2.5px var(--ink) inset,0 8px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px}
.rest-pet{width:150px;height:150px;margin:0 auto}
.rest-pet svg{width:100%;height:100%}
.rest-card h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.rest-card p{margin:0;line-height:1.6}
.gate-wrap{position:absolute;inset:0;z-index:120;background:rgba(91,69,80,.45)}
.gq{font-family:var(--display);font-size:32px}
#gateIn{font:inherit;font-size:24px;text-align:center;padding:10px;border-radius:14px;border:0;box-shadow:0 0 0 2.5px var(--ink) inset;user-select:text;-webkit-user-select:text;color:var(--ink);background:#fff}
#villageTabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;pointer-events:auto;padding-bottom:4px}
#villageTabs::-webkit-scrollbar{display:none}
#villageTabs button{flex:none}
.talk-face img,.dex-card .art img{width:100%;height:100%;display:block;object-fit:contain}
.race-ui{position:absolute;inset:0;z-index:9;pointer-events:none}
.race-count{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:72px;color:#fff;text-shadow:0 4px 0 var(--ink),0 0 20px rgba(91,69,80,.35)}
.race-tip{position:absolute;bottom:176px;left:0;right:0;margin:0;text-align:center;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.race-btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);pointer-events:auto;width:148px;height:148px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:26px;line-height:1.2;box-shadow:0 6px 0 #B54A60,0 0 0 4px #fff inset;touch-action:none}
.race-btn.on{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #B54A60,0 0 0 4px #fff inset}
.race-btn:disabled{opacity:.55}
.mallow{width:76px;height:60px;border-radius:26px;margin:2px auto;box-shadow:0 0 0 3px var(--ink) inset,0 6px 0 rgba(91,69,80,.15);transition:background .1s}
.heat{position:relative;height:18px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFE27A,#FF8A3D,#9A5B2E)}
.heat .gold{position:absolute;top:0;bottom:0;left:60%;width:25%;box-shadow:0 0 0 2.5px #2FA36B inset;background:rgba(126,217,195,.25)}
#rHold{touch-action:none;font-size:19px;padding:14px}
#rHold.on{transform:translateY(3px)}
.ntag{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:13px;background:rgba(255,255,255,.92);padding:2px 9px;border-radius:99px;box-shadow:0 0 0 2px var(--ink) inset;white-space:nowrap}
.ntag i{font-style:normal;color:#E8476A}
.fade{position:absolute;inset:0;background:#FFF6E9;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}
.fade.on{opacity:1}
.talk{position:absolute;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -2.5px 0 var(--ink),0 -10px 30px rgba(91,69,80,.15);padding-block:14px max(16px,env(safe-area-inset-bottom,0px));animation:slideup .25s cubic-bezier(.2,1.2,.4,1)}
.talk-head{display:flex;align-items:center;gap:10px}
.talk-face{width:60px;height:60px;flex:none;border-radius:18px;background:var(--soft);box-shadow:0 0 0 2px var(--ink) inset;padding:2px}
.talk-face svg{width:100%;height:100%}
.talk-who{display:flex;flex-direction:column;min-width:0}
.talk-name{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.talk-job{font-size:12px;color:var(--muted)}
.talk-hearts{margin-left:auto;color:#E8476A;font-size:16px;letter-spacing:1px;white-space:nowrap}
.talk-text{font-size:17px;line-height:1.6;margin:10px 0 12px;min-height:3.3em;cursor:pointer;text-wrap:pretty}
.talk-choices{display:grid;gap:8px}
.talk-choices .candy{text-align:left;font-size:16px;padding:10px 14px}
.form-chip{display:inline-block;margin-left:4px;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--butter);box-shadow:0 0 0 1.5px var(--ink) inset;white-space:nowrap}
.eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}

<script>
(() => {
'use strict';

/* =========================================================
   1. 기본 도구
   ========================================================= */
const $ = s => document.querySelector(s);
const escapeHTML = value => String(value).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const INK = '#5B4550';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const today = () => new Date().toDateString();
const SAVE_KEY = 'malang-pet-house-v1';

// 겹친 도형을 하나의 실루엣처럼 외곽선 처리: 굵은 잉크 레이어 위에 같은 도형을 색으로 덮는다
const ol = (shapes, fill, w = 7) =>
  `<g fill="${INK}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round">${shapes}</g><g fill="${fill}">${shapes}</g>`;

function star(cx, cy, R, r, n = 5) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    pts.push((cx + Math.cos(a) * rad).toFixed(1) + ',' + (cy + Math.sin(a) * rad).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}"/>`;
}
/* =========================================================
   2. 오리지널 캐릭터 5종
   - 공통 규칙: 몸통 = 머리(2등신 이하), 눈은 얼굴 중앙보다 아래, 점 눈 + 하이라이트,
     작은 w 입, 볼터치, 코코아색 둥근 외곽선, 캐릭터마다 실루엣만 봐도 구별되는 특징 1개
   ========================================================= */
const SPECIES = {
  bunny: {
    name: '몽글이', kind: '구름 토끼', color: '#A9DDF7', bg: '#EAF7FF', fav: 'cake',
    hatTop: 64, eye: 122, mouth: 139,
    desc: '구름 위에서 태어난 폭신폭신 토끼예요. 쓰다듬어 주면 몸이 더 몽글몽글해져요.',
    draw() {
      const f = '#F7FCFF';
      const ears = '<ellipse cx="74" cy="58" rx="15" ry="36" transform="rotate(-14 74 58)"/><ellipse cx="126" cy="58" rx="15" ry="36" transform="rotate(14 126 58)"/>';

function eyesSVG(mood, y, big) {
  const xs = [78, 122];
  const line = d => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (mood === 'happy' || mood === 'love') return xs.map(x => line(`M${x - 8} ${y + 3} Q${x} ${y - 8} ${x + 8} ${y + 3}`)).join('');
  if (mood === 'sleep') return xs.map(x => line(`M${x - 8} ${y} Q${x} ${y + 7} ${x + 8} ${y}`)).join('');
  if (mood === 'eat') return line(`M${xs[0] - 6} ${y - 6} L${xs[0] + 5} ${y} L${xs[0] - 6} ${y + 6}`) + line(`M${xs[1] + 6} ${y - 6} L${xs[1] - 5} ${y} L${xs[1] + 6} ${y + 6}`);
  const rx = big ? 8 : 7, ry = big ? 10.5 : 9;
  let s = '<g class="eyes">' + xs.map(x =>
    `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/><circle cx="${x + 2.6}" cy="${y - 3.4}" r="2.9" fill="#fff"/><circle cx="${x - 2.4}" cy="${y + 3.6}" r="1.3" fill="#fff"/>`).join('') + '</g>';
  if (mood === 'sad') {
    s += line(`M${xs[0] - 9} ${y - 13} L${xs[0] + 6} ${y - 18}`) + line(`M${xs[1] - 6} ${y - 18} L${xs[1] + 9} ${y - 13}`);

  }
  return s;
}

let AC = null;
const SFX = {
  tap: [[740, .05]], pop: [[660, .06], [880, .08]], coin: [[988, .07], [1319, .14]],
  eat: [[330, .06], [262, .06], [349, .07]], hatch: [[523, .1], [659, .1], [784, .1], [1047, .28]],
  up: [[523, .08], [659, .08], [784, .08], [1047, .08], [1319, .22]], bad: [[247, .12], [196, .18]],
  bub: [[1000, .035]], night: [[523, .18], [392, .3]], buy: [[784, .06], [1047, .06], [1568, .12]]
};
function sfx(kind) {
  if (!S || !S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    let t = AC.currentTime;
    for (const [f0, d] of SFX[kind]) {
      const f = kind === 'bub' ? f0 + Math.random() * 500 : f0;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.16, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination);
      o.start(t); o.stop(t + d + .03);
      t += d * .85;
    }
  } catch (e) {}
}

function particle(content, x, y, cls = '') {
  const s = document.createElement('span');
  s.className = 'p ' + cls; s.textContent = content;
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.setProperty('--dx', rand(-40, 40).toFixed(0) + 'px');
  fx.appendChild(s);
  s.addEventListener('animationend', () => s.remove());
  return s;
}

let tempMood = null, tempUntil = 0;

function moodOf(p) {
  if (p.asleep) return 'sleep';
  if (tempMood && Date.now() < tempUntil) return tempMood;
  const m = Math.min(p.hunger, p.fun, p.clean, p.energy);
  if (m < 25) return 'sad';
  if ((p.hunger + p.fun + p.clean + p.energy) / 4 > 72) return 'happy';
  return 'normal';
}
function idleLine() {
  const p = P();
  if (!p) return '';
  if (!p.hatched) return `톡톡 두드려서 알을 깨워 주세요! (${p.taps}/${HATCH_TAPS})`;
  if (p.asleep) return '쿨쿨… 좋은 꿈 꾸는 중';
  const lows = [
    ['hunger', 35, ['배에서 꼬르륵 소리가 나요…', '맛있는 거 먹고 싶어요!']],
    ['clean', 35, ['몸이 끈적끈적해요…', '거품 목욕 하고 싶어요!']],
    ['energy', 30, ['하암… 졸려요…', '눈이 자꾸 감겨요…']],
    ['fun', 35, ['심심해요! 같이 놀아요!', '별똥별 받기 하고 싶어요!']]
  ];
  for (const [k, t, ls] of lows) if (p[k] < t) return pick(ls);
  const fav = FOODS.find(f => f.id === SPECIES[p.sp].fav);
  return pick([
    `${p.name} 기분 최고!`, '쓰다듬어 주면 좋겠다~', '오늘은 뭐 하고 놀까?', '나랑 놀아 줘서 고마워!',
    `${fav.name} 먹고 싶다…`, '새 모자 써 보고 싶어!', '천천히 건강하게 크고 싶어!'
  ]);
}
function addXP(n) {
  const p = P(); p.xp += n;
  let up = false;
  const formBefore = formOf(p.level);
  while (p.xp >= needXP(p.level) && p.level < 30) {
    p.xp -= needXP(p.level); p.level++; up = true;
    S.coins += 10;
  }
  if (!up) return;
  const f = formOf(p.level);
  if (f !== formBefore) {
    if (f >= 1) badge('form1'); if (f >= 2) badge('form2'); if (f >= 4) badge('form4'); if (f >= 2) story('form2');
    World.transform(formBefore, () => {
      confetti(110); sfx('hatch');
      toast(`✨ 변신! ${FORMS[f].name} ${p.name}`);
      say(`짜잔! ${p.name}가 ${FORMS[f].name} 모습으로 변신했어요!`, 6000);
    });
  } else { sfx('up'); toast(`레벨 업! Lv.${p.level}  보너스 10코인`); confetti(40); }
}
function change(stats) {
  const p = P();
  for (const k in stats) p[k] = clamp(p[k] + stats[k], FLOOR, 100);
}
function decayAll(minutes) {
  for (const p of S.pets) {
    if (!p.hatched) continue;
    const r = p.asleep ? DECAY_ASLEEP : DECAY_AWAKE;
    for (const k in r) {
      const nv = p[k] + r[k] * minutes;
      p[k] = r[k] < 0 ? Math.max(Math.min(p[k], FLOOR), nv) : Math.min(100, nv);
    }
    if (p.asleep && p.energy >= 100 && p === P() && !gameOn) wake(true);
  }
}

    // 욕실
    const tub = group(5.6, 0, -6.6);
    mesh(BOX, '#FFFFFF', 0, .45, 0, 3, .9, 1.9, tub, { outline: 1.02 });
    mesh(BOX, '', 0, .86, 0, 2.7, .06, 1.6, tub, { mat: new T.MeshToonMaterial({ color: '#9EDCF7', gradientMap: grad, transparent: true, opacity: .9 }), cast: false });
    mesh(SPH, '#FFD54F', 1, .98, .3, .17, .15, .17, tub); mesh(SPH, '#FFD54F', 1.08, 1.15, .3, .11, .11, .11, tub);
    tag(tub, 'bath');
    mesh(BOX, '#FFFFFF', 2, .5, -7.4, 1.1, 1, .8); mesh(CYL, '#DDF5EE', 2, 1.01, -7.4, .35, .02, .3);
    mesh(BOX, '', 2, 1.75, -7.98, .9, .9, .04, null, { mat: basic('#E9F7FF'), cast: false });
    mesh(BOX, '#7ED9C3', 5.6, .02, -4.4, 1.8, .04, 1.1, null, { receive: true, cast: false });
    mesh(BOX, '#FF9EB0', 7.97, 1.3, -2.8, .06, .9, .6);
  }

  /* ---------- 펫 만들기 ---------- */
  function buildPet(spId, hatId, form, tint) {
    const c = PET3[spId], R = c.R, cy = c.cy;
    const root = new T.Group(), body = new T.Group(); root.add(body);
    const pt = { root, body, isEgg: false };
    const add = (color, x, y, z, sx, sy, sz, parent = body, ol = 1.07, geo = SPH) => mesh(geo, color, x, y, z, sx, sy, sz, parent, { outline: ol });
    const zAt = (x, y) => Math.sqrt(Math.max(0, R * R - x * x - (y - cy) * (y - cy)));
    const pivot = (x, y, z, parent = body) => group(x, y, z, parent);
    const bc = tint || c.body;

    // 몸 (머리와 몸이 하나인 동글동글 2등신)
    add(bc, 0, cy, 0, R, R * (spId === 'penguin' ? 1.1 : .93), R * .96);
    const feet = (color = bc) => {
      pt.footL = add(color, -.24, .07, .28, .16, .08, .2, root); pt.footR = add(color, .24, .07, .28, .16, .08, .2, root); pt.footBase = .07;
    };
    if (spId === 'bunny') {
      for (const [x, y, z, r] of [[-.48, cy - .12, -.02, .27], [.48, cy - .12, -.02, .27], [-.25, cy + .42, -.06, .25], [.25, cy + .42, -.06, .25], [0, cy + .5, -.1, .27]]) add(bc, x, y, z, r, r * .92, r);
      pt.earL = pivot(-.2, cy + .62, -.05); pt.earR = pivot(.2, cy + .62, -.05); pt.earBase = .18;
      for (const [e, s] of [[pt.earL, 1], [pt.earR, -1]]) { add(bc, 0, .36, 0, .13, .4, .09, e, 1.1); add('#FFC9DA', 0, .36, .06, .065, .3, .03, e, 0); e.rotation.z = s * .18; }
      feet();
    } else if (spId === 'hamster') {
      pt.earL = pivot(-.4, cy + .48, -.05); pt.earR = pivot(.4, cy + .48, -.05); pt.earBase = .1;
      for (const e of [pt.earL, pt.earR]) { add(bc, 0, .08, 0, .17, .17, .1, e, 1.1); add('#FFC1C8', 0, .08, .07, .1, .1, .02, e, 0); }
      add('#FFF8EA', 0, cy - .24, zAt(0, cy - .24) - .14, .4, .3, .2, body, 0);
      for (const [x, z, r] of [[-.13, .1, -.4], [0, .15, 0], [.13, .1, .4]]) { const m = add('#A57A63', x, cy + R * .9, z, .06, .04, .045, body, 0); m.rotation.y = r; }
      pt.handL = add(bc, -.22, cy - .3, zAt(.22, cy - .3) - .02, .1, .08, .08); pt.handR = add(bc, .22, cy - .3, zAt(.22, cy - .3) - .02, .1, .08, .08);
      feet();
    } else if (spId === 'penguin') {
      add('#F4FFFC', 0, cy - .14, zAt(0, cy - .14) - .16, .4, .44, .22, body, 0);
      pt.flL = pivot(-.5, cy + .12, 0); pt.flR = pivot(.5, cy + .12, 0); pt.flBase = .35;
      add('#7FD8C6', 0, -.22, 0, .09, .26, .18, pt.flL, 1.1); add('#7FD8C6', 0, -.22, 0, .09, .26, .18, pt.flR, 1.1);
      const beak = add('#FFB35C', 0, cy - .06, zAt(0, cy - .06) + .07, .08, .16, .08, body, 1.12, CONE); beak.rotation.x = Math.PI / 2;
      pt.tuft = pivot(0, cy + R * 1.08, 0); const tf = add('#7FD8C6', 0, .08, 0, .07, .16, .07, pt.tuft, 1.1, CONE); tf.rotation.z = .3;
      feet('#FFB35C');
    } else if (spId === 'dragon') {
      add('#F3EEFF', 0, cy - .24, zAt(0, cy - .24) - .14, .36, .28, .2, body, 0);
      for (const [x, y] of [[-.34, cy + .3], [.34, cy + .3], [-.2, cy + .45], [.2, cy + .45]]) add('#B6A0F5', x, y, zAt(x, y) - .03, .06, .06, .03, body, 0);
      const ws = form >= 1 ? 1.35 : 1;
      pt.wingL = pivot(-.32, cy + .15, -.4); pt.wingR = pivot(.32, cy + .15, -.4); pt.wingBase = .5;
      add('#FFC7E5', -.28 * ws, .12, 0, .32 * ws, .24 * ws, .05, pt.wingL, 1.1); add('#FFC7E5', .28 * ws, .12, 0, .32 * ws, .24 * ws, .05, pt.wingR, 1.1);
      pt.tail = pivot(0, .32, -.5);
      add(bc, 0, 0, -.16, .15, .13, .24, pt.tail, 1.1); add(bc, 0, .1, -.4, .1, .1, .16, pt.tail, 1.1);
      add('#FFD95A', 0, .22, -.55, .13, .13, .13, pt.tail, 1.1, STAR);
      const horn = add('#FFD95A', 0, cy + R * .93 + .12, 0, .22 * (form >= 2 ? 1.3 : 1), .22 * (form >= 2 ? 1.3 : 1), .22, body, 1.1, STAR);
      if (form >= 2) horn.material = new T.MeshToonMaterial({ color: '#FFE27A', emissive: '#FFB300', emissiveIntensity: .45, gradientMap: grad });
      feet();
    } else if (spId === 'squirrel') {
      pt.tail = pivot(0, .3, -.42);
      for (const [y, z, r] of [[.05, -.12, .26], [.4, -.32, .32], [.82, -.3, .34], [1.15, -.08, .3]]) add('#E9A066', 0, y, z, r, r, r * .9, pt.tail, 1.06);
      add('#F7C796', 0, 1.2, .02, .18, .16, .16, pt.tail, 0);
      pt.earL = pivot(-.3, cy + .5, 0); pt.earR = pivot(.3, cy + .5, 0); pt.earBase = .25;
      for (const [e, s] of [[pt.earL, 1], [pt.earR, -1]]) { add(bc, 0, .12, 0, .1, .17, .07, e, 1.1); add('#E9A066', 0, .27, 0, .05, .07, .04, e, 0); e.rotation.z = s * .25; }
      add('#FFF0DD', 0, cy - .24, zAt(0, cy - .24) - .14, .36, .28, .2, body, 0);
      const capColor = form >= 2 ? '#E8B54A' : '#A86E43';
      add(capColor, 0, cy + .22, 0, R * 1.03, R * .62, R * 1.03, body, 1.05, HALF);
      add('#8A5530', 0, cy + .22 + R * .62 + .06, 0, .05, .14, .05, body, 1.1, CYL);
      feet();
    } else if (spId === 'fox') {
      add('#FFF4E8', 0, cy - .22, zAt(0, cy - .22) - .15, .4, .3, .2, body, 0);
      for (const s of [-1, 1]) add('#FFF4E8', s * .32, cy - .1, zAt(.32, cy - .1) - .08, .15, .11, .1, body, 0);
      pt.earL = pivot(-.28, cy + .48, -.02); pt.earR = pivot(.28, cy + .48, -.02); pt.earBase = .22;
      for (const [e, s] of [[pt.earL, 1], [pt.earR, -1]]) { add(bc, 0, .2, 0, .15, .32, .1, e, 1.1, CONE); add(INK, 0, .34, .01, .06, .1, .05, e, 0, CONE); e.rotation.z = s * .22; }
      pt.tail = pivot(0, .35, -.48);
      add(bc, 0, .12, -.18, .2, .2, .32, pt.tail, 1.08); add(bc, 0, .34, -.42, .22, .2, .26, pt.tail, 1.08); add('#FFF4E8', 0, .5, -.56, .14, .13, .14, pt.tail, 1.1);
      feet('#8A5530');
    } else if (spId === 'sheep') {
      for (const [x, y, z, r] of [[-.44, cy + .08, -.12, .3], [.44, cy + .08, -.12, .3], [-.26, cy + .44, -.12, .3], [.26, cy + .44, -.12, .3], [0, cy + .56, -.08, .3], [0, cy + .22, -.36, .4], [-.38, cy - .28, -.16, .26], [.38, cy - .28, -.16, .26]]) add('#FFFFFF', x, y, z, r, r * .92, r, body, 1.06);
      pt.earL = pivot(-.46, cy + .1, .12); pt.earR = pivot(.46, cy + .1, .12); pt.earBase = .5;
      add('#F2D2BC', -.13, 0, 0, .15, .07, .09, pt.earL, 1.1); add('#F2D2BC', .13, 0, 0, .15, .07, .09, pt.earR, 1.1);
      for (const s of [-1, 1]) { const h = add('#E9C79A', s * .32, cy + .44, .12, .09, .09, .09, body, 1.1, new T.TorusGeometry(1, .38, 8, 16)); h.rotation.y = Math.PI / 2; }
      feet('#8E7A85');
    } else if (spId === 'turtle') {
      const shell = add('#7FB86A', 0, .38, -.24, R * 1.05, R * .95, R * .92, body, 1.04, HALF); shell.rotation.x = -1.1;
      for (const [x, y] of [[0, .95], [-.32, .74], [.32, .74], [0, .6]]) add('#6AA35A', x, y, -.6, .13, .13, .05, body, 0);
      add('#F3F7D0', 0, cy - .26, zAt(0, cy - .26) - .14, .36, .26, .2, body, 0);
      feet('#8FCB72');
    }

    // 얼굴: 기분마다 눈·입 모양을 바꿔 보여 준다
    const ey = cy + .02, ex = .19, face = group(0, 0, 0, body);
    const ink = toon(INK);
    pt.eyesOpen = group(0, 0, 0, face); pt.eyesHappy = group(0, 0, 0, face); pt.eyesSleep = group(0, 0, 0, face);
    const arc = new T.TorusGeometry(.07, .02, 8, 16, Math.PI), mArc = new T.TorusGeometry(.045, .015, 8, 12, Math.PI);
    for (const s of [-1, 1]) {
      const z = zAt(s * ex, ey);
      mesh(SPH, '', s * ex, ey, z - .02, .075, .1, .05, pt.eyesOpen, { mat: ink, cast: false });
      mesh(SPH, '#FFFFFF', s * ex + .025, ey + .035, z + .025, .028, .028, .02, pt.eyesOpen, { cast: false });
      mesh(arc, '', s * ex, ey - .02, z + .01, 1, 1, 1, pt.eyesHappy, { mat: ink, cast: false });
      const sl = mesh(arc, '', s * ex, ey + .03, z + .01, 1, 1, 1, pt.eyesSleep, { mat: ink, cast: false }); sl.rotation.z = Math.PI;
      const bl = mesh(SPH, '', s * .33, ey - .1, zAt(.33, ey - .1) - .01, form >= 2 && spId === 'hamster' ? .11 : .085, .045, .02, face, { mat: new T.MeshToonMaterial({ color: '#FF9DB5', gradientMap: grad, transparent: true, opacity: .85 }), cast: false });
      bl.rotation.y = s * .55;
    }
    const my = spId === 'penguin' ? ey - .22 : ey - .15, mz = zAt(0, my) + .01;
    pt.mouthSmile = mesh(mArc, '', 0, my, mz, 1, 1, 1, face, { mat: ink, cast: false }); pt.mouthSmile.rotation.z = Math.PI;
    pt.mouthFrown = mesh(mArc, '', 0, my - .02, mz, 1, 1, 1, face, { mat: ink, cast: false });
    pt.mouthOpen = mesh(SPH, '#F07A8E', 0, my - .01, mz - .01, .06, .05, .03, face, { cast: false });
    pt.tear = mesh(SPH, '#8FD3FF', -ex - .03, ey - .11, zAt(ex, ey - .11) + .02, .03, .045, .03, face, { cast: false });
    pt.setFace = mood => {
      const happy = ['happy', 'love', 'eat'].includes(mood);
      pt.eyesOpen.visible = mood === 'normal' || mood === 'sad'; pt.eyesHappy.visible = happy; pt.eyesSleep.visible = mood === 'sleep';
      pt.mouthSmile.visible = mood === 'normal'; pt.mouthFrown.visible = mood === 'sad'; pt.tear.visible = mood === 'sad';
      pt.mouthOpen.visible = happy || mood === 'sleep'; pt.mouthOpen.scale.set(mood === 'sleep' ? .03 : .06, mood === 'sleep' ? .03 : .05, .03);
    };
    pt.dirt = group(0, 0, 0, body);
    for (const [x, y] of [[-.3, cy - .3], [.35, cy - .05], [.12, cy - .42], [-.2, cy + .25]]) mesh(SPH, '', x, y, zAt(x, y) - .01, .07, .05, .02, pt.dirt, { mat: dirtMat, cast: false });
    pt.setDirt = v => { pt.dirt.visible = v > 0; dirtMat.opacity = v; };

    // 변신 장식: 어린이(목도리·나비넥타이) → 어른(이마 별) → 반짝(별 궤도) → 무지개(무지개 날개·후광)
    if (form >= 1) {
      if (spId === 'penguin') { for (const s of [-1, 1]) { const b = add(c.accent, s * .09, cy - R * .62, zAt(0, cy - R * .62) - .02, .07, .12, .07, body, 1.1, CONE); b.rotation.z = s * Math.PI / 2; } add(c.accent, 0, cy - R * .62, zAt(0, cy - R * .62), .04, .04, .04, body, 1.1); }
      else { const sc = add(c.accent, 0, cy - R * .6, 0, R * .78, R * .78, R * .78, body, 1.03, new T.TorusGeometry(1, .1, 10, 32)); sc.rotation.x = Math.PI / 2; }
    }
    if (form >= 2 && spId !== 'dragon') add('#FFD95A', 0, cy + R * .55, zAt(0, cy + R * .55) + .02, .07, .07, .07, body, 1.12, STAR);
    if (form >= 2 && spId === 'penguin') for (const x of [-.12, 0, .12]) add('#BFEFFF', x, cy + R * 1.02, .1, .04, x ? .09 : .13, .04, body, 1.1, CONE);
    if (form >= 2 && spId === 'bunny') for (const e of [pt.earL, pt.earR]) add('#FFB7D0', 0, .68, .02, .09, .1, .07, e, 0);
    if (form >= 3) {
      pt.orbit = group(0, cy, 0, root);
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const s = mesh(STAR, '', Math.cos(a) * 1, Math.sin(i * 2) * .25, Math.sin(a) * 1, .07, .07, .07, pt.orbit, { mat: basic(['#FFE27A', '#FF9DB5', '#A9DDF7'][i % 3]), cast: false }); s.userData.spin = i; }
    }
    if (form >= 4) {
      pt.rainbow = pivot(0, cy + .1, -.5);
      const cols = ['#FF9DB5', '#FFE27A', '#A9DDF7'];
      for (const s of [-1, 1]) cols.forEach((col, i) => { const w = add(col, s * (.45 - i * .04), .1 + i * .02, -i * .03, .42 - i * .08, .3 - i * .05, .04, pt.rainbow, i ? 0 : 1.08); w.rotation.z = s * -.35; });
      const halo = mesh(new T.TorusGeometry(.32, .04, 8, 32), '', 0, (hatId ? c.hat + .55 : c.hat + .2), 0, 1, 1, 1, body, { mat: basic('#FFF3A8'), cast: false }); halo.rotation.x = Math.PI / 2;
    }

    // 모자
    if (hatId) {
      const h = group(0, c.hat, 0, body), o = 1.1;
      if (hatId === 'ribbon') { h.position.x = .3; h.rotation.z = -.3; for (const s of [-1, 1]) { const k = add('#FF7FA6', s * .13, 0, 0, .09, .16, .09, h, o, CONE); k.rotation.z = s * Math.PI / 2; } add('#FF5C8A', 0, 0, 0, .06, .06, .06, h, o); }
      else if (hatId === 'flower') { h.position.x = -.3; for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; add('#FFFFFF', Math.cos(a) * .1, Math.sin(a) * .1, .05, .065, .065, .04, h, o); } add('#FFD54F', 0, 0, .08, .06, .06, .04, h, o); }
      else if (hatId === 'sprout') { add('#8FD694', 0, .1, 0, .025, .22, .025, h, o, CYL); for (const s of [-1, 1]) { const l = add('#8FD694', s * .1, .24, 0, .11, .05, .07, h, o); l.rotation.z = s * .4; } }
      else if (hatId === 'crown') { add('#FFD54F', 0, .07, 0, .22, .14, .22, h, 1.06, new T.CylinderGeometry(1, 1, 1, 16, 1, true)); for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; add('#FFD54F', Math.cos(a) * .2, .2, Math.sin(a) * .2, .05, .09, .05, h, o, CONE); } add('#FF8FA3', 0, .08, .22, .04, .04, .04, h, 0); }
      else if (hatId === 'witch') { add('#4E3780', 0, 0, 0, .4, .03, .4, h, o, CYL); const cn = add('#6B4FA0', 0, .3, 0, .24, .58, .24, h, o, CONE); cn.rotation.z = .2; add('#FF9A3D', 0, .07, 0, .25, .06, .25, h, 0, CYL); }
      else if (hatId === 'wizard') { add('#6570CF', 0, 0, 0, .36, .03, .36, h, o, CYL); const cn = add('#7C86E0', 0, .27, 0, .24, .52, .24, h, o, CONE); cn.rotation.z = -.15; add('#FFE27A', .02, .3, .18, .06, .06, .06, h, 0, STAR); }
      else if (hatId === 'glasses') { h.position.set(0, 0, 0); for (const s of [-1, 1]) mesh(new T.TorusGeometry(.085, .018, 8, 20), '#FF7FA6', s * ex, ey, zAt(ex, ey) + .05, 1, 1, 1, h, { cast: false }); mesh(CYL, '#FF7FA6', 0, ey + .02, zAt(0, ey) + .05, .015, .1, .015, h, { cast: false }).rotation.z = Math.PI / 2; }
    }
    root.scale.setScalar(FORM_SCALE[form]);
    root.traverse(o => { if (o.isMesh) o.userData.pet = true; });
    root.userData.pet = true;
    return pt;
  }

  function buildEgg(spId, taps) {
    const root = new T.Group(), body = new T.Group(); root.add(body);
    const pts = [];
    for (let i = 0; i <= 24; i++) { const t = i / 24; pts.push(new T.Vector2(Math.max(.001, .56 * Math.pow(Math.sin(Math.PI * t), .85) * (1.08 - .3 * t)), t * 1.3)); }
    const rAt = y => { const t = y / 1.3; return .56 * Math.pow(Math.sin(Math.PI * t), .85) * (1.08 - .3 * t); };
    mesh(new T.LatheGeometry(pts, 36), '#FFFDF6', 0, 0, 0, 1, 1, 1, body, { outline: 1.04 });
    const col = SPECIES[spId].color;
    for (const [y, a, s] of [[.5, .6, .12], [.78, -.7, .1], [.98, .2, .08], [.38, 2.6, .13], [.82, 3.6, .1]]) {
      const r = rAt(y); const m = mesh(SPH, col, Math.sin(a) * r * .97, y, Math.cos(a) * r * .97, s, s * .8, s * .5, body, { cast: false }); m.lookAt(Math.sin(a) * 3, y, Math.cos(a) * 3);
    }
    const cracks = [[.6, -.25, .4], [.62, .05, -.5], [.66, .25, .5], [.85, -.1, .3], [.45, .2, -.3]];
    cracks.slice(0, taps).forEach(([y, x, rot]) => { const m = mesh(BOX, '', x, y, rAt(y) * Math.cos(Math.asin(Math.min(.95, x / rAt(y)))) + .005, .16, .025, .02, body, { mat: toon(INK), cast: false }); m.rotation.z = rot; });
    if (taps >= 3) for (const s of [-1, 1]) mesh(SPH, '', s * .12, .55, rAt(.55) - .01, .045, .06, .03, body, { mat: toon(INK), cast: false });
    root.traverse(o => { if (o.isMesh) o.userData.pet = true; });
    root.userData.pet = true;
    return { root, body, isEgg: true };
  }

  /* ---------- 길 찾기: 같은 방이면 바로, 아니면 문을 거쳐서 ---------- */
  const roomAt = (x, z) => x < 0 ? (z >= 0 ? 'living' : 'bedroom') : (z >= 0 ? 'kitchen' : 'bath');
  const doorBetween = (a, b) => DOORS.find(d => (d[0] === a && d[1] === b) || (d[0] === b && d[1] === a));
  function pathTo(tx, tz) {
    const a = roomAt(st.x, st.z), b = roomAt(tx, tz);
    if (a === b) return [[tx, tz]];
    const d = doorBetween(a, b);
    if (d) return [[d[2], d[3]], [tx, tz]];
    for (const mid of Object.keys(ROOM3)) {
      const d1 = doorBetween(a, mid), d2 = doorBetween(mid, b);
      if (d1 && d2) return [[d1[2], d1[3]], [d2[2], d2[3]], [tx, tz]];
    }

  function animateVillage(dt) {
    const t = st.t;
    for (const n of Object.values(npcs)) {
      const p = n.parts, dx = st.x - (VX + n.x), dz = st.z - n.z, near = Math.hypot(dx, dz) < 3.2;
      n.t += dt;
      if (n.hidden) { p.root.visible = false; n.tag.hidden = true; continue; }
      p.root.visible = true;
      if (n.racing) { n.walk = !!race && race.t >= 0; n.faceGoal = Math.PI; }
      else if (n.follow && !n.talking) {
        const bx = st.x - VX - Math.sin(st.face) * 1.5 + Math.cos(st.face) * .9, bz = st.z - Math.cos(st.face) * 1.5 - Math.sin(st.face) * .9;
        const ex = bx - n.x, ez = bz - n.z, d = Math.hypot(ex, ez);
        if (d > .35) { const sp = Math.min(d, (d > 3 ? 4.2 : 2.2) * dt); n.x += ex / d * sp; n.z += ez / d * sp; n.faceGoal = Math.atan2(ex, ez); n.walk = true; }
        else { n.walk = false; n.faceGoal = st.face; }
      }
      else if (n.talking || near) { n.walk = false; n.faceGoal = Math.atan2(dx, dz); }
      else {
        n.wt -= dt;
        if (n.wt <= 0) { [n.tx, n.tz] = clampVillage(n.hx + rand(-1.3, 1.3), n.hz + rand(-1, 1)); n.wt = rand(3, 7); }
        const ex = n.tx - n.x, ez = n.tz - n.z, d = Math.hypot(ex, ez);
        if (d > .05) { const sp = Math.min(d, .9 * dt); n.x += ex / d * sp; n.z += ez / d * sp; n.faceGoal = Math.atan2(ex, ez); n.walk = true; } else { n.walk = false; n.faceGoal = 0; }
      }
      n.face = turn(n.face, n.faceGoal, dt * 6);
      const cyc = n.t * 9, s = n.walk ? Math.cos(cyc * 2) * .04 : Math.sin(n.t * 2.2) * .02;
      p.root.position.set(VX + n.x, n.walk ? Math.abs(Math.sin(cyc)) * .12 : (n.talking ? Math.abs(Math.sin(n.t * 5)) * .05 : 0), n.z);
      p.root.rotation.set(0, n.face, n.walk ? Math.sin(cyc) * .06 : 0);
      p.body.scale.set(1 + s, 1 - s, 1 + s);
      if (n.jumpT > 0) { n.jumpT -= dt; p.root.position.y += Math.sin((1 - n.jumpT / .6) * Math.PI) * .8; }
      if (p.footL) { p.footL.position.y = p.footBase + (n.walk ? Math.max(0, Math.sin(cyc)) * .1 : 0); p.footR.position.y = p.footBase + (n.walk ? Math.max(0, -Math.sin(cyc)) * .1 : 0); }
      if (p.earL) { const sw = Math.sin(n.t * 2.5) * .06; p.earL.rotation.z = p.earBase + sw; p.earR.rotation.z = -p.earBase - sw; }
      if (p.tail) p.tail.rotation.y = Math.sin(n.t * 5) * .35;
      if (p.wingL) { const f = Math.sin(n.t * 5) * .3; p.wingL.rotation.y = p.wingBase + f; p.wingR.rotation.y = -p.wingBase - f; }
      if (p.flL) { const f = Math.sin(n.t * 2) * .1; p.flL.rotation.z = -p.flBase - f - (n.talking ? Math.abs(Math.sin(n.t * 6)) * .6 : 0); p.flR.rotation.z = p.flBase - f; }
      n.blink -= dt; if (n.blink < 0) n.blink = rand(2.5, 5);
      if (p.eyesOpen) p.setFace(n.blink < .12 ? 'sleep' : (n.talking ? 'happy' : 'normal'));
      // 이름표
      const v = new T.Vector3(VX + n.x, 2.6, n.z).project(camera);
      const on = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
      n.tag.hidden = !on;
      if (on) { n.tag.style.left = (v.x + 1) / 2 * room.clientWidth + 'px'; n.tag.style.top = (1 - v.y) / 2 * room.clientHeight + 'px'; n.tag.querySelector('i').textContent = friendAlert(n.id) ? ' ❗' : ''; }
    }
    for (const d of drops) { const k = (t * .7 + d.ph) % 1; d.m.position.set(VX + Math.cos(d.a) * k * 1.4, 1.85 + Math.sin(k * Math.PI) * .9 - k * .9, -1.5 + Math.sin(d.a) * k * 1.4); }
    for (const s of swings) s.piv.rotation.x = Math.sin(t * 2 + s.ph) * .35;
    for (const f of flies) { const a = t * f.sp + f.ph; f.bf.position.set(VX + f.cx + Math.cos(a) * f.r, 1.2 + Math.sin(a * 3) * .3, f.cz + Math.sin(a) * f.r); f.bf.rotation.y = -a; const w = Math.sin(t * 22 + f.ph) * .9; f.wl.rotation.z = w; f.wr.rotation.z = -w; }
    for (const [i, f] of flames.entries()) f.scale.y = (i ? .5 : .8) * (1 + Math.sin(t * 13 + i) * .12 + Math.sin(t * 29) * .06);
    if (fireLight) fireLight.intensity = 1 + Math.sin(t * 17) * .2;
    if (blades) blades.rotation.z += dt * .8;
    if (sea) sea.position.y = .03 + Math.sin(t * 1.3) * .03;
    for (let i = candies.length - 1; i >= 0; i--) {
      const c = candies[i]; c.position.y = .6 + Math.sin(t * 3 + i) * .12;
      if (Math.hypot(c.position.x - st.x, c.position.z - st.z) < 1.2) { villageG.remove(c); candies.splice(i, 1); onCandy && onCandy(c.userData.idx); }
    }
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i]; s.position.y = .55 + Math.sin(t * 3 + i) * .1;
      if (Math.hypot(s.position.x - st.x, s.position.z - st.z) < 1.2) { villageG.remove(s); shells.splice(i, 1); sfx('coin'); onShell && onShell(shells.length); }
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i]; s.rotation.y = t * 2.5; s.position.y = .8 + Math.sin(t * 3 + i) * .15;
      if (Math.hypot(s.position.x - st.x, s.position.z - st.z) < 1.2) { villageG.remove(s); stars.splice(i, 1); sfx('coin'); onStar && onStar(stars.length); }
    }
  }

  function obbyStep(dt) {
    const o = ob; if (o.done) return;

      pl.dx = nx - (pl.cx ?? nx); pl.dz = nz - (pl.cz ?? nz); pl.cx = nx; pl.cz = nz;
      pl.mesh.position.set(OX + nx, pl.y - .25, nz);
    }

    let x = st.x - OX, z = st.z;

  function stepRace(dt) {
    race.t += dt; if (race.t < 0) return;
    const L = 17.4;
    race.boost = Math.max(0, race.boost - dt * 1);
    race.p += (1.6 + race.boost) * dt; race.q += (3 + Math.sin(race.t * 2.3) * .4) * dt;
    st.z = 17.2 - Math.min(race.p, L); race.n.z = 17.2 - Math.min(race.q, L); st.faceGoal = Math.PI;
    if (race.p >= L || race.q >= L) { const r = race; race = null; r.n.racing = false; st.run = false; r.cb(r.p >= r.q); }
  }
  function setArea(a) {

  /* ---------- 매 프레임 ---------- */
  function think(dt, p) {
    if (race) return;
    const free = p.hatched && !p.asleep && !bathing && !gameOn && !scrim && !talking && !document.querySelector('.mini, .race-ui') && !hide && st.mode === 'idle' && !st.trick && st.eatT <= 0;
    if (st.mode === 'walk' && st.path.length) {
      const [tx, tz] = st.path[0], dx = tx - st.x, dz = tz - st.z, d = Math.hypot(dx, dz), sp = (st.run ? 4.2 : 1.8) * dt;
      if (d <= sp) {
        st.x = tx; st.z = tz; st.path.shift();
        if (!st.path.length) { st.mode = 'idle'; st.idleT = rand(2.5, 5); st.faceGoal = 0; const cb = st.arrive; st.arrive = null; cb && cb(); }
      } else { st.x += dx / d * sp; st.z += dz / d * sp; st.faceGoal = Math.atan2(dx, dz); }
    } else if (free && st.area === 'village') {
      st.idleT -= dt;
      if (st.idleT <= 0) {
        const r = Math.random();
        if (r < .55) goTo(VX + rand(-7, 7), rand(-4, 6), false);
        else if (r < .8) trick(pick(['spin', 'hop', 'dance', 'wave']));
        else { const n = pick(Object.keys(FRIENDS)); say(`${josa(FRIENDS[n].name, '이', '')}다! 안녕~`, 2500); }
        st.idleT = rand(4, 7);

    } else if (free && !st.at) {

        const r = Math.random(), sleepy = p.energy < 30, here = ROOM3[roomAt(st.x, st.z)];
        if (sleepy) { if (r < .4) say(pick(['하암…', '졸려요…', '눈이 감겨요…']), 2500); st.idleT = rand(4, 7); }
        else if (r < .45) goTo(rand(here.x0 + 1.2, here.x1 - 1.2), rand(here.z0 + 1.2, here.z1 - 1.2), false);
        else if (r < .55) { const k = pick(Object.keys(ROOM3)); goTo(ROOM3[k].cx, ROOM3[k].cz, false); }
        else if (r < .8) trick(pick(['spin', 'hop', 'dance', 'wave']));

        else { st.faceGoal = rand(-1.2, 1.2); }
        st.idleT = rand(3, 6);

    } else if (free && st.at && st.at !== 'sofa' && st.at !== 'tv') {

    } else if (free && st.at) { st.idleT -= dt; if (st.idleT <= -8) { st.at = null; st.lift = 0; goTo(st.x + 1.5, st.z, false); } }
    if (st.eatT > 0) st.eatT -= dt;

  function animate(dt, p) {

    const t = st.t, walking = (st.mode === 'walk' && st.path.length > 0) || !!(race && race.t >= 0) || (st.area === 'obby' && st.obMove), cyc = t * (st.run ? 16 : 10);

      if (pet.tail) pet.tail.rotation.y = Math.sin(t * (st.mood === 'happy' || st.mood === 'love' ? 9 : 4)) * .38;

      if (pet.flL) { const f = walking ? Math.sin(cyc) * .5 : Math.sin(t * 2) * .1; pet.flL.rotation.z = -pet.flBase - f - wave * 1.6; pet.flR.rotation.z = pet.flBase - f; }

  function loop(now) {
    requestAnimationFrame(loop);
    // 프레임이 늦게 와도 걷는 속도가 같도록, 밀린 시간을 0.05초씩 나눠 계산한다
    const dt = Math.min(.5, (now - (st.last || now)) / 1000); st.last = now;
    if (document.hidden || gameOn || $('#home').hidden) return;
    const p = P(); if (!p) return;
    st.t += dt;
    if (race) stepRace(dt);
    if (st.area === 'obby' && ob) { for (let left = dt; left > 1e-4; left -= .02) obbyStep(Math.min(.02, left)); }
    else for (let left = dt; left > 1e-4; left -= .05) think(Math.min(.05, left), p);
    animate(Math.min(dt, .1), p);

World.onTap = hit => {
  const p = P(); if (!p) return;
  const u = hit.o.userData;
  if (placing) { if (World.area() === 'house') placeAt(hit.point.x, hit.point.z); return; }
  if (u.pet) return patPet();
  if (!p.hatched) return say(u.use === 'door' ? '알에서 깨어나면 같이 나가요!' : idleLine(), 3000);
  if (talking) return;
  if (u.npc) return World.hidden(u.npc) ? hideGuess(-1) : talkTo(u.npc);
  if (u.use === 'home') return World.goHome();
  if (u.use && u.use.startsWith('water:')) return waterBed(+u.use.slice(6));
  if (u.use && u.use.startsWith('bush:')) return hideGuess(+u.use.slice(5));
  if (u.use && u.use.startsWith('plot:')) return tapPlot(+u.use.slice(5));
  if (u.use === 'portal') return World.goVillage('portal', true, startObby);
  if (u.use && u.use.startsWith('bld:')) return World.goVillage(u.use.slice(4), true);
  if (u.use) return useThing(u.use);
  if (u.floor && !p.asleep) {
    const st = World.st, far = Math.hypot(hit.point.x - st.x, hit.point.z - st.z) > 4;
    World.goTo(hit.point.x, hit.point.z, far);
    particle('✨', hit.sx, hit.sy, 'plus');
  }
};

  if (bathing && use !== 'bath') return;
  if (use === 'feed') return openFeed();
  if (use === 'bath') return bathing ? endBath() : startBath();
  if (use === 'sleep') return p.asleep ? wake(false) : sleep();
  if (use === 'play') { World.goSpot('arcade', true); return openPlayMenu(); }

  say(outside ? `${food.name} 소풍 도시락이다!` : `${food.name} 먹으러 부엌으로 고고!`, 3000);

function fs(id) {
  S.friends = S.friends || {};
  return S.friends[id] || (S.friends[id] = { pts: 0, met: false, day: '', q: 'none', qday: '', gday: '', rday: '', rcount: 0, rid: 0 });
}
const heartsOf = id => Math.min(5, Math.floor(fs(id).pts / 100));
function addFriend(id, n) {
  const before = heartsOf(id); fs(id).pts += n;
  const after = heartsOf(id);
  if (after >= 5) badge('bestie');
  if (after > before) { S.coins += 20; sfx('up'); confetti(50); toast(`${josa(FRIENDS[id].name, '과', '와')} 더 친해졌어요! ${'♥'.repeat(after)} +20코인`); }
  persist();
}
let watered = [false, false, false], starsStarted = false;
function friendAlert(id) {
  const f = fs(id);
  if (!f.met) return true;
  if (id === 'porong' && f.q === 'active' && watered.every(Boolean)) return true;
  if (id === 'banjjak' && f.q === 'active' && starsStarted && World.starsLeft() === 0) return true;
  if (id === 'neurit' && f.q === 'active' && shellsStarted && World.shellsLeft() === 0) return true;
  return false;
}

/* ---------- 대화창 ---------- */
let talking = null, typeTimer = 0, fullText = '';
function typeText(t) {
  const el = $('#talkText'); clearInterval(typeTimer); fullText = t; let i = 0; el.textContent = '';
  typeTimer = setInterval(() => { i += 2; el.textContent = t.slice(0, i); if (i >= t.length) clearInterval(typeTimer); }, 28);
}
$('#talkText').addEventListener('click', () => { clearInterval(typeTimer); $('#talkText').textContent = fullText; });
function showNode(node) {
  if (!node || !talking) return closeTalk();
  typeText(node.text);
  const box = $('#talkChoices'); box.innerHTML = '';
  for (const c of node.choices || [{ label: '👋 안녕!', fn: () => null }]) {
    const b = document.createElement('button'); b.className = 'candy'; b.textContent = c.label;
    b.addEventListener('click', () => { sfx('tap'); showNode(c.fn()); });
    box.appendChild(b);
  }
  const h = heartsOf(talking);
  $('#talkHearts').textContent = '♥'.repeat(h) + '♡'.repeat(5 - h);
}
function talkTo(id) {
  if (talking || World.hidden(id)) return;
  const f = FRIENDS[id];
  World.walkToNpc(id, () => {
    talking = id; World.setTalking(id, true);
    $('#talkFace').innerHTML = `<img src="${World.portrait(id)}" alt="${f.name}">`;
    $('#talkName').textContent = f.name; $('#talkJob').textContent = f.job;
    $('#talk').hidden = false; pushBack(); sfx('pop');
    const s = fs(id);
    if (!s.met) { s.met = true; s.day = 'met'; addFriend(id, 30); if (Object.keys(FRIENDS).every(k => fs(k).met)) badge('friends8'); showNode(firstMeet(id)); }
    else showNode(menu(id, true));
    mission('talk');

// 마시멜로 굽기 (루루): 꾹 누르고 있다가 노릇한 순간에 손을 뗀다
function roast() {
  closeTalk();
  const wrap = document.createElement('div'); wrap.className = 'scrim mini';
  wrap.innerHTML = `<div class="g-card roast"><h3>🔥 마시멜로 굽기</h3><p id="rHelp">버튼을 <b>꾹</b> 누르고 있다가<br>노릇노릇할 때 손을 떼요!</p>
    <div class="mallow" id="mallow"></div><div class="heat"><i id="heatBar"></i><span class="gold"></span></div>
    <p id="rCount">1번째 마시멜로 · 성공 0개</p><button class="candy primary" id="rHold">꾹 눌러서 굽기</button></div>`;
  $('#app').appendChild(wrap);
  let heat = 0, holding = false, round = 1, good = 0, timer = 0, done = false, waiting = false;
  const bar = wrap.querySelector('#heatBar'), mal = wrap.querySelector('#mallow'), btn = wrap.querySelector('#rHold');
  const color = h => h < 35 ? '#FFFFFF' : h < 60 ? '#FFF1C9' : h <= 85 ? '#E9A55A' : h < 95 ? '#9A5B2E' : '#3A2A22';
  const draw = () => { bar.style.width = heat + '%'; mal.style.background = color(heat); };
  const help = '버튼을 <b>꾹</b> 누르고 있다가<br>노릇노릇할 때 손을 떼요!';
  function release() {
    if (!holding || done) return;
    holding = false; clearInterval(timer); btn.classList.remove('on'); waiting = true;
    const nice = heat >= 60 && heat <= 85;
    if (nice) { good++; sfx('coin'); } else sfx('bad');
    wrap.querySelector('#rHelp').innerHTML = nice ? '노릇노릇! 완벽해요 😋' : heat < 60 ? '앗, 아직 덜 익었어요!' : '앗 뜨거! 너무 탔어요 🔥';
    setTimeout(() => {
      if (round >= 3) return finish();
      round++; heat = 0; draw(); waiting = false;
      wrap.querySelector('#rCount').textContent = `${round}번째 마시멜로 · 성공 ${good}개`;
      wrap.querySelector('#rHelp').innerHTML = help;
    }, 1200);
  }
  function finish() {
    done = true;
    const coins = good ? playReward('ruru', good * 5) : 0;
    addFriend('ruru', 10 + good * 5); change({ fun: 10 + good * 3 }); addXP(5 + good * 2); render();
    mission('friend');
    if (good === 3) confetti(60);
    wrap.querySelector('.roast').innerHTML = `<h3>${good === 3 ? '마시멜로 박사님!' : good ? '맛있게 구웠어요!' : '다음엔 더 잘할 수 있어!'}</h3><div class="big-score">${'🍡'.repeat(good) || '🔥'}</div><p>${good}개 성공!${good ? (coins ? ` 상으로 ${coins}코인!` : ' 코인 보상은 이미 받았어요.') : ''}</p><button class="candy primary" id="rDone">캠핑장으로 돌아가기</button>`;
    wrap.querySelector('#rDone').addEventListener('click', () => { wrap.remove(); say(pick(['루루: "냠냠, 같이 먹으니까 더 맛있다!"', '루루: "또 캠프파이어 하자!"']), 4000); });
  }
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); if (done || holding || waiting) return;
    holding = true; btn.classList.add('on');
    const t0 = performance.now();
    timer = setInterval(() => { heat = Math.min(100, (performance.now() - t0) / 30); draw(); if (heat >= 100) release(); }, 30);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, release));
  draw();
}

    }
    const [tx, tz] = World.bushPos(hide.spot), [bx, bz] = World.bushPos(i), dx = tx - bx, dz = tz - bz;
    const hint = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? '더 오른쪽이야!' : '더 왼쪽이야!') : (dz < 0 ? '더 위쪽이야!' : '더 아래쪽이야!');

function seeded(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return () => ((h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0) / 4294967296); }
function todayMissions() {
  // Compatibility name retained. Goals do not expire when the date changes.
  if (!S.missions || !Array.isArray(S.missions.list)) {
    const r = seeded('malang-friendly-goals-v1'), ids = Object.keys(MISSIONS).map(id => [r(), id]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    S.missions = { day: 'ongoing', list: ids.slice(0, 3).map(id => ({ id, prog: 0, claimed: false })) };
    persist();
  }
  return S.missions;
}
function mission(id, n = 1) {
  story(STORY_MAP[id] || id, n);
  const it = todayMissions().list.find(x => x.id === id), M = MISSIONS[id];
  if (!it || it.prog >= M.goal) return;
  it.prog = Math.min(M.goal, it.prog + n);
  if (it.prog >= M.goal) { toast(`📋 미션 완료! ${M.text}`); sfx('up'); }
  renderHUD(); persist();
}
function openMissions(tab = 'm') {
  if (tab === 'b') return openBadges();

    return `<div class="mission${done ? ' done' : ''}"><span class="mi">${M.icon}</span><span class="mt"><b>${M.text}</b><span class="mbar"><i style="width:${it.prog / M.goal * 100}%"></i></span><small>${it.prog} / ${M.goal}</small></span>${it.claimed ? '<span class="mclaimed">받음 ✓</span>' : `<button class="candy${done ? ' primary' : ''}" data-claim="${i}"${done ? '' : ' disabled'}><i class="coin"></i> ${M.coin}</button>`}</div>`;

const stageMs = c => CROPS[c].min * 20000;

function growFarm() {

  for (const pl of S.farm.plots) {

    if (now - pl.start >= stageMs(pl.crop)) { pl.stage++; pl.wet = false; pl.start = now; changed = true; }

}
function tapPlot(i) {

let obbyUI = null, obTimer = 0;
const obKeys = {};
function boundedReward(key, coins, max = 3) {
  S.rewardClaims = S.rewardClaims || {};
  // Migrate an already-earned count once; this cap never resets by calendar day.
  if (!(key in S.rewardClaims)) S.rewardClaims[key] = S.daily?.[key] || 0;
  const n = S.rewardClaims[key]; if (n >= max) return 0;
  S.rewardClaims[key] = n + 1; S.coins += coins; renderHUD(); persist(); return coins;
}
function startObby() {
  const p = P();
  if (!p.hatched || obbyUI) return;
  if (p.energy < 15) return say('너무 졸려서 점프를 못 하겠어요… 먼저 재워 주세요', 3000);

  World.enterObby(obbyEvent);

}
function buildObbyUI() {
  obbyUI = document.createElement('div'); obbyUI.className = 'obby-ui';
  const best = S.best.obby;
  obbyUI.innerHTML = `<div class="ob-top"><span class="pill">⏱ <b id="obTime">0.0</b>초</span><span class="pill">🚩 <b id="obCp">0/2</b></span>${best ? `<span class="pill">🏆 ${best.toFixed(1)}</span>` : ''}<button class="icon-btn" id="obExit" aria-label="나가기">✕</button></div>
    <p class="ob-tip">왼쪽 동그라미로 움직이고, 점프 버튼으로 뛰어요! 분홍 젤리는 조심!</p>
    <div class="joy" id="joy"><i id="joyKnob"></i></div><button class="jump-btn" id="obJump">점프!</button>`;
  room.appendChild(obbyUI);
  const joy = obbyUI.querySelector('#joy'), knob = obbyUI.querySelector('#joyKnob'), inp = World.obbyInput;
  let jid = null;
  const setJ = e => {
    const r = joy.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R; const l = Math.hypot(dx, dy);
    if (l > 1) { dx /= l; dy /= l; }
    inp.x = dx; inp.z = dy; knob.style.transform = `translate(${dx * R * .55}px, ${dy * R * .55}px)`;
  };
  joy.addEventListener('pointerdown', e => { e.preventDefault(); jid = e.pointerId; joy.setPointerCapture?.(jid); setJ(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) setJ(e); });
  const endJ = () => { jid = null; inp.x = 0; inp.z = 0; knob.style.transform = ''; };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => joy.addEventListener(t, endJ));
  const jb = obbyUI.querySelector('#obJump');
  jb.addEventListener('pointerdown', e => { e.preventDefault(); inp.jump = true; jb.classList.add('on'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => jb.addEventListener(t, () => jb.classList.remove('on')));
  obbyUI.querySelector('#obExit').addEventListener('click', exitObby);
  window.addEventListener('keydown', obKey); window.addEventListener('keyup', obKey);
  obTimer = setInterval(() => { const el = $('#obTime'); if (el) el.textContent = World.obbyTime().toFixed(1); }, 100);
  setTimeout(() => { const t = obbyUI && obbyUI.querySelector('.ob-tip'); t && t.remove(); }, 6000);
  renderHUD();
}
function obKey(e) {
  const map = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd', ' ': 'j' }, k = map[e.key];
  if (!k) return;
  e.preventDefault();
  const inp = World.obbyInput, down = e.type === 'keydown';
  if (k === 'j') { if (down) inp.jump = true; return; }
  obKeys[k] = down;
  inp.x = (obKeys.r ? 1 : 0) - (obKeys.l ? 1 : 0); inp.z = (obKeys.d ? 1 : 0) - (obKeys.u ? 1 : 0);
}
function closeObbyUI() {
  clearInterval(obTimer); window.removeEventListener('keydown', obKey); window.removeEventListener('keyup', obKey);
  obbyUI && obbyUI.remove(); obbyUI = null;
  const r = $('#obResult'); r && r.remove();
}
function exitObby() { closeObbyUI(); World.exitObby(); setTimeout(renderHUD, 500); }
function obbyEvent(kind, v) {
  if (kind === 'cp') { const el = $('#obCp'); if (el) el.textContent = `${v}/2`; toast('🚩 체크포인트! 떨어져도 여기서 다시 시작해요'); }

}
function obbyFinish(time) {

  sfx('up'); confetti(60); toast(`📜 모험 완료! ${q.text} +${q.reward}코인`);
  const next = STORY[S.story.i];
  if (!next) { badge('story'); setTimeout(() => chapterBanner('🏆 모험 완료!', '말랑 마을의 진짜 모험가가 됐어요!'), 1200); }
  else if (next.ch !== q.ch) setTimeout(() => chapterBanner(CHAPTERS[next.ch], CH_SUB[next.ch]), 1200);
}
function story(id, n = 1) {
  if (!S || !S.story || !P()) return;
  let q = STORY[S.story.i];
  if (q && q.id === id && !STORY_DONE[id]) { S.story.prog = Math.min(q.goal, S.story.prog + n); if (S.story.prog >= q.goal) completeStep(); }
  for (let g = 0; g < 20 && (q = STORY[S.story.i]) && STORY_DONE[q.id] && STORY_DONE[q.id](); g++) completeStep();
  persist(); renderHUD();
}
function storyCatchUpOnLoad() {
  let got = 0, q;
  for (let g = 0; g < 20 && (q = STORY[S.story.i]) && STORY_DONE[q.id] && STORY_DONE[q.id](); g++) { got += q.reward; completeStep(true); }
  if (got) { persist(); setTimeout(() => toast(`📜 지난 모험을 이어서 했어요! +${got}코인`), 1500); }
  renderHUD();
}
function chapterBanner(title, sub) {
  const el = document.createElement('div'); el.className = 'chapter';
  el.innerHTML = `<b>${title}</b><span>${sub}</span>`;
  room.appendChild(el); sfx('hatch'); setTimeout(() => el.remove(), 3200);
}
const questNpc = g => g.includes(':') ? g.split(':')[1] : (Object.keys(FRIENDS).find(k => !fs(k).met) || 'somsom');
function questTarget() {
  const q = S.story && STORY[S.story.i], p = P();
  if (!q || !p || !p.hatched || !q.go) return null;
  const area = World.area(), g = q.go, house = { feed: 'bowl', bath: 'bath', cook: 'stove', door: 'door' };
  if (house[g]) return area === 'house' ? { spot: house[g] } : { exit: true };
  if (g === 'garden' || g === 'portal' || g.startsWith('npc')) {
    if (area !== 'village') return { exit: true };
    return g === 'garden' || g === 'portal' ? { vspot: g } : { npc: questNpc(g) };
  }
  return null;
}
function renderQuest(hide) {
  const qb = $('#questBtn'), q = S.story && STORY[S.story.i];
  qb.hidden = hide || bathing || !!placing || !S.story || (!q && S.story.doneSeen);
  if (q) {
    const prog = STORY_PROG[q.id] ? STORY_PROG[q.id]() : S.story.prog;
    qb.innerHTML = `<span class="q-tx"><span class="q-ch">📜 ${CHAPTERS[q.ch]} · ${S.story.i + 1}/${STORY.length}</span><b>${q.text}${q.goal > 1 ? ` <em>${prog}/${q.goal}</em>` : ''}</b></span><span class="q-go">${q.go ? '가기 ▶' : '도움말'}</span>`;
  } else qb.innerHTML = '<span class="q-tx"><span class="q-ch">📜 말랑 모험</span><b>모든 모험 완료! 🎉</b></span><span class="q-go">닫기</span>';
  World.setGuide(questTarget());
}
// '가기 ▶': 다른 곳에 있으면 그곳으로 데려다주고, 할 일을 바로 연다
function goQuest() {
  const q = STORY[S.story.i]; if (!q) return;
  if (!q.go) return say(q.hint || '조금만 더 힘내요!', 3500);
  if (talking) closeTalk();
  const area = World.area(), g = q.go;
  if (area === 'obby') return;
  if (g === 'pet') return say('나를 톡톡 눌러서 쓰다듬어 줘!', 3000);
  if (g === 'shop') return openShop('decor');
  if (g === 'cook') return openCook();
  if (g === 'feed') return area === 'house' ? openFeed() : World.goHome(openFeed);
  if (g === 'bath') return area === 'house' ? startBath() : World.goHome(startBath);
  if (g === 'door') return area === 'house' ? goOutside() : say('벌써 마을에 나왔어요!', 2000);
  if (area !== 'village') { pendingQuest = true; return goOutside(); }
  if (g === 'garden') return World.goVillage('garden', true, () => say('밭을 눌러서 씨앗을 심거나 물을 줘요!', 3000));
  if (g === 'portal') return World.goVillage('portal', true, startObby);
  talkTo(questNpc(g));
}
$('#questBtn').addEventListener('click', () => {
  sfx('tap');
  if (!STORY[S.story.i]) { S.story.doneSeen = true; persist(); return renderHUD(); }
  goQuest();
});

/* ---------- 계절 축제 (지금은 할로윈): 기간 안에 아무 때나 사탕을 찾고, 선물은 상점에서도 살 수 있다 ---------- */
const SEASON = (() => {
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  return (m === 10 && day >= 15) || (m === 11 && day <= 7) ? { id: 'halloween' + d.getFullYear(), name: '할로윈 축제' } : null;
})();
const CANDY_SPOTS = [[-3, 4.2], [4.6, -4.8], [-11.6, -2.6], [5.6, 9.2], [-5.5, 10.5], [9.5, 12], [18, -.6], [23, 8.5], [14.5, 4], [-9, -4.5], [1.5, 7], [11, -1.6]];
const SEASON_SHOP = [{ kind: 'decor', id: 'jack', name: '호박 등불', e: '🎃', cost: 6 }, { kind: 'hat', id: 'witch', name: '마녀 모자', e: '🧙', cost: 12 }];
function seasonState() {
  if (!SEASON) return null;
  if (!S.season || S.season.id !== SEASON.id) S.season = { id: SEASON.id, candy: 0, found: [] };
  return S.season;
}
function spawnCandies() {
  const ev = seasonState(); if (!ev) return;
  World.spawnCandies(CANDY_SPOTS.map((c, i) => [i, c[0], c[1]]).filter(c => !ev.found.includes(c[0])), i => {
    if (ev.found.includes(i)) return;
    ev.found.push(i); ev.candy++; sfx('coin');
    toast(`🍬 사탕 ${ev.found.length}/${CANDY_SPOTS.length}`);
    if (ev.found.length >= CANDY_SPOTS.length) { badge('season'); say('사탕을 모두 찾았어요! 📋 목표 화면의 🎃 탭에서 선물로 바꿔요', 5000); }
    renderHUD(); persist();
  });
}
function openSeason() {
  const ev = seasonState(); if (!ev) return openMissions('m');
  const owned = it => it.kind === 'hat' ? S.hats.includes(it.id) : decorState().owned.includes(it.id);
  const cards = SEASON_SHOP.map((it, i) => `<button class="item${owned(it) ? ' on' : ''}" data-sz="${i}"${owned(it) ? ' disabled' : ''}><span class="em">${it.e}</span><span class="nm">${it.name}</span><span class="pr">${owned(it) ? '받음 ✓' : `🍬 ${it.cost}개`}</span></button>`).join('');
  openSheet('🎃 할로윈 축제', `${missionTabs('e')}<p class="msub">마을 곳곳에 숨은 사탕을 찾아 선물로 바꿔요. 서두르지 않아도 돼요. 선물은 상점에서 코인으로도 살 수 있어요.</p><div class="ev-head"><span class="pill">🍬 ${ev.candy}</span><span>찾은 사탕 ${ev.found.length} / ${CANDY_SPOTS.length}</span></div><div class="grid">${cards}</div>`,
    body => body.addEventListener('click', e => {
      const tb = e.target.closest('[data-mtab]'); if (tb) return openMissions(tb.dataset.mtab);
      const b = e.target.closest('[data-sz]'); if (!b) return;
      const it = SEASON_SHOP[+b.dataset.sz];
      if (owned(it)) return;
      if (ev.candy < it.cost) return toast(`사탕이 ${it.cost - ev.candy}개 더 필요해요. 마을을 둘러봐요!`);
      ev.candy -= it.cost;
      if (it.kind === 'hat') S.hats.push(it.id); else decorState().owned.push(it.id);
      sfx('buy'); confetti(50); toast(`${it.e} ${josa(it.name, '을', '를')} 받았어요! 상점에서 쓰거나 놓을 수 있어요`);
      persist(); render(); openSeason();
    }));
}

/* =========================================================
   11-2. 추억의 오락실

const AW = 240, AH = 320;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const hit = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;

function petImages(p) {
  const mk = mood => { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(petSVG(p.sp, { mood, stage: 'kid', hat: p.hat })); return i; };

function rrect(ctx, x, y, w, h, r) {

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

function sky(ctx, top, bottom) {
  const gr = ctx.createLinearGradient(0, 0, 0, AH); gr.addColorStop(0, top); gr.addColorStop(1, bottom);

function drawPet(ctx, img, x, y, s, flip, run = 0, air = false) {

// 꾸물이: 심술 난 보라 먹구름

const BUBBLE_MAPS = [

  { lad: [[30, 0], [210, 0], [120, 1], [60, 2], [180, 2], [120, 3]], spr: [[150, 1], [40, 3]], bees: [1, 2, 3] },
  { lad: [[120, 0], [25, 1], [215, 1], [90, 2], [160, 3]], spr: [[60, 0], [190, 2]], bees: [1, 2, 3, 4] }

function ladderStage(g) {
  const m = LADDER_MAPS[g.stage % 3];
  g.lad = m.lad.map(([x, i]) => ({ x, i }));
  g.spr = m.spr.map(([x, i]) => ({ x, i, sq: 0 }));
  g.items = [];
  for (let i = 0; i < LADDER_F.length; i++) for (const x of [44, 92, 140, 188]) {
    if (i === 0 && x < 50) continue;
    const blocked = g.lad.some(l => (l.i === i || l.i === i - 1) && Math.abs(l.x - x) < 16) || g.spr.some(s => s.i === i && Math.abs(s.x - x) < 16);

  g.bees = m.bees.map((i, k) => ({ i, x: 40 + (k * 53) % 160, y: LADDER_F[i] - 11, vx: (k % 2 ? -1 : 1) * (38 + g.stage * 14), ph: k }));

    const msg = g.win ? '끝판까지 해냈어요!' : g.score >= 400 ? '정말 잘했어요!' : '함께해서 즐거웠어요!';
    const card = document.createElement('div'); card.className = 'g-card';
    card.innerHTML = `<h3>${msg}</h3><div class="big-score">${g.score}</div><p>${isBest && g.score ? '🏆 새 최고 기록!' : `최고 기록 ${S.best[def.id] || 0}`}</p><p><i class="coin"></i> ${coins}코인 · 경험치 ${xp} · 행복 +25</p><button class="candy primary" id="gHome">방으로 돌아가기</button>`;
    wrap.appendChild(card);
    card.querySelector('#gHome').addEventListener('click', closeGame);
  }
  function closeGame() {
    gameOn = false;
    window.removeEventListener('resize', fit); window.removeEventListener('keydown', kd); window.removeEventListener('keyup', kd);
    wrap.remove(); setMood('happy', 1500); say('재미있게 놀았어요! 잠깐 쉬어도 좋아요.'); render();
  }
  wrap.querySelector('#gStart').addEventListener('click', () => { wrap.querySelector('#gCard').remove(); g.run = true; sfx('pop'); });
  wrap.querySelector('#gClose').addEventListener('click', () => { if (g.run && g.score > 0) { g.over = true; } else closeGame(); });
  requestAnimationFrame(loop);
}

/* =========================================================
   12. 버튼 연결
   ========================================================= */
$('#actions').addEventListener('click', e => {
  const b = e.target.closest('.act'); if (!b || b.disabled) return;
  sfx('tap');
  const p = P();
  if (World.area() === 'village' && (b.dataset.act === 'bath' || b.dataset.act === 'sleep')) {
    if (talking) closeTalk();
    say('집에 가서 할래요!', 2500);
    return World.goHome(() => b.dataset.act === 'bath' ? startBath() : sleep());
  }
  if (talking) closeTalk();
  switch (b.dataset.act) {
    case 'feed': return openFeed();
    case 'play': return openPlayMenu();
    case 'bath': return bathing ? endBath() : startBath();
    case 'sleep': return p.asleep ? wake(false) : sleep();
    case 'shop': return openShop();
    case 'dex': return openDex();
  }
});
$('#settingsBtn').addEventListener('click', () => { sfx('tap'); openSettings(); });
$('#missionBtn').addEventListener('click', () => { sfx('tap'); openMissions(); });

/* =========================================================
   13. 시작(입양) 화면
   ========================================================= */
let chosen = 'bunny';
function renderPick() {
  const s = SPECIES[chosen];
  $('#pickBig').innerHTML = petSVG(chosen, { mood: 'happy', stage: 'kid' });
  $('#pickName').textContent = s.name;
  $('#pickKind').textContent = s.kind;
  $('#pickDesc').textContent = s.desc;
  $('.pick-stage').style.background = s.bg;
  $('#nameInput').placeholder = s.name;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.sp === chosen));
}
function showStart() {
  $('#start').hidden = false; $('#home').hidden = true;
  $('#chips').innerHTML = SPECIES_ORDER.map(sp => `<button class="chip" data-sp="${sp}" aria-label="${SPECIES[sp].name}" style="--chip:${SPECIES[sp].color};--chipbg:${SPECIES[sp].bg}">${petSVG(sp, { stage: 'kid' })}</button>`).join('');
  $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { chosen = c.dataset.sp; sfx('pop'); renderPick(); } });
  renderPick();
}
$('#startBtn').addEventListener('click', () => {
  const name = $('#nameInput').value.trim() || SPECIES[chosen].name;
  S.pets.push(newPet(chosen, name)); S.active = 0; S.lastTick = Date.now();
  persist(); sfx('hatch'); showHome();
  setTimeout(() => chapterBanner(CHAPTERS[1], CH_SUB[1]), 700);
  say(idleLine(), 9000);
});

let worldReady = false;
function showHome() {
  $('#start').hidden = true; $('#home').hidden = false;
  buildStats();
  if (!worldReady) { World.init(); worldReady = true; World.setDecor(decorState().placed); World.setGarden(farm().plots); World.setEvent(!!SEASON); }
  render();
}

/* =========================================================
   14. 시간 흐름 + 부팅
   ========================================================= */
function tick() {
  const now = Date.now();
  const mins = (now - S.lastTick) / 60000;
  S.lastTick = now;
  if (mins > 0 && S.pets.length) decayAll(mins);
  growFarm();
  if (P()) render();
}
let saveCount = 0;
function start(hotData) {
  S = (hotData && hotData.v === 1 && Array.isArray(hotData.pets)) ? hotData : (load() || freshSave());
  S.best = S.best || {};
  S.story = S.story || { i: 0, prog: 0 };
  S.parent = Object.assign({ limit: 60, breakEvery: 30, bedtime: true }, S.parent);
  if (!S.pets.length) { showStart(); }
  else {
    const away = (Date.now() - S.lastTick) / 60000;
    showHome(); tick(); storyCatchUpOnLoad();
    const p = P();
    say(idleLine(), 7000);
  }
  setInterval(() => { if (!S.pets.length) return; tick(); playTick(); if (++saveCount % 10 === 0) persist(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (S.pets.length) { tick(); persist(); } });
  window.addEventListener('pagehide', persist);
}
if ('serviceWorker' in navigator && !window.Capacitor && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
})();
</script>
</body>
