<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>말랑 영어 펫하우스</title>
<meta name="description" content="유아부터 초등 6학년까지 펫을 키우며 영어를 배우는 게임">
<meta name="theme-color" content="#FFF8E9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말랑영어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/Jua-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<style>
@font-face{font-family:"Jua";src:url("fonts/Jua-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Gowun Dodum";src:url("fonts/GowunDodum-Regular.woff2") format("woff2");font-display:swap}
/* Layout: 폰 한 화면 앱. 위 = 이름·코인·상태 막대, 가운데 = 펫이 사는 방(무대), 아래 = 엄지로 누르는 큰 사탕 버튼 6개 */
:root{
  --wall:#FFF8E9;      /* 민트 벽지 */
  --mint:#80DDBB;
  --sky:#75CFFF;
  --lav:#BDA6F6;
  --butter:#FFD36E;
  --coral:#FF967F;
  --ink:#35435A;       /* 코코아 잉크: 캐릭터 외곽선과 글자 */
  --paper:#FFFFFF;
  --soft:#F5FAFA;
  --line:#E4E6EA;
  --muted:#5E6A80;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;overscroll-behavior:none}
body{background:#E8F7FF radial-gradient(#CFEBFA 1.6px,transparent 1.8px) 0 0/22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #4BB8A0;outline-offset:2px}
#app{position:relative;height:100%;padding-top:env(safe-area-inset-top,0px);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--wall);overflow:hidden;box-shadow:0 0 0 2px #BFE3D4,0 24px 60px rgba(53,67,90,.18)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 공통 사탕 버튼 ---------- */
.candy{border:0;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 #D9C9D1,0 0 0 2.5px var(--ink) inset;padding:10px 14px;font-family:var(--display);font-size:17px;transition:transform .08s}
.candy:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C9D1,0 0 0 2.5px var(--ink) inset}
.candy.primary{background:var(--coral);color:var(--ink);box-shadow:0 4px 0 #D9735F,0 0 0 2.5px var(--ink) inset}
.candy.primary:active{box-shadow:0 1px 0 #D9735F,0 0 0 2.5px var(--ink) inset}
.candy:disabled{opacity:.45;cursor:default;transform:none}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0 0 18%,#FFD54F 20% 62%,#F2B623 64%);box-shadow:0 0 0 1.5px var(--ink);vertical-align:-.12em}

/* ---------- 시작(입양) 화면 ---------- */
#start{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:22px 18px;overflow-y:auto}
.logo{font-family:var(--display);font-size:42px;line-height:1;text-align:center;letter-spacing:-.01em;margin:4px 0 0;color:var(--ink);text-wrap:balance}
.logo b{color:var(--coral);font-weight:400}
.tag{text-align:center;margin:0;color:var(--muted)}
.pick-stage{position:relative;background:var(--paper);border-radius:28px;box-shadow:0 0 0 2.5px var(--ink) inset,0 6px 0 #C4E6D8;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick-stage .big{width:min(58vw,210px);aspect-ratio:1;max-width:100%}
.pick-stage .big svg{width:100%;height:100%;animation:hop 1.6s ease-in-out infinite;transform-origin:50% 95%}
.pick-name{font-family:var(--display);font-size:28px;margin:0}
.pick-kind{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);box-shadow:0 0 0 1.5px var(--line) inset}
.pick-desc{margin:6px 0 0;text-align:center;line-height:1.55;max-width:32ch;text-wrap:pretty}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{min-width:0;border:0;background:var(--paper);border-radius:18px;aspect-ratio:1;padding:4px;box-shadow:0 0 0 2px var(--line) inset;transition:transform .15s}
.chip svg{width:100%;height:100%}
.chip[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink) inset,0 4px 0 var(--chip,#ccc);transform:translateY(-3px);background:var(--chipbg,#fff)}
.name-row{display:flex;gap:8px;align-items:center}
.name-row label{font-family:var(--display);font-size:16px;white-space:nowrap}
.name-row input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 14px;border-radius:14px;border:0;box-shadow:0 0 0 2.5px var(--ink) inset;background:var(--paper);color:var(--ink);user-select:text}
#startBtn{font-size:21px;padding:14px}
.fine{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* ---------- 방 화면 ---------- */
#home{flex:1;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding-block:12px 6px}
.who{flex:1;min-width:0}
.who h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:3px}
.lv b{font-family:var(--display);font-weight:400;font-size:13px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px}
.xp{flex:1;max-width:120px;height:7px;border-radius:9px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);overflow:hidden}
.xp i{display:block;height:100%;background:var(--butter);width:0;transition:width .4s}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:17px;padding:6px 12px;border-radius:99px;background:var(--paper);box-shadow:0 0 0 2px var(--ink) inset;font-variant-numeric:tabular-nums}
.icon-btn{border:0;width:40px;height:40px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--ink) inset;font-size:19px;display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding-block:4px 10px}
.stat{display:flex;align-items:center;gap:6px;font-size:13px}
.stat span{width:4.6em;white-space:nowrap}
.bar{flex:1;height:12px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:9px;background:var(--c);transition:width .5s}
.stat.low .bar{animation:blinkbar 1s steps(2) infinite}

.room{position:relative;flex:1;min-height:240px;overflow:hidden;border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);background:#BFE8FF;touch-action:pinch-zoom}
.room.bathing{cursor:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
.room-tabs{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:6px;z-index:6;padding-inline:8px;flex-wrap:wrap;pointer-events:none}
.room-tabs button{pointer-events:auto;border:0;border-radius:99px;padding:5px 11px;font-family:var(--display);font-size:14px;background:rgba(255,255,255,.88);box-shadow:0 0 0 2px var(--ink) inset,0 2px 0 rgba(53,67,90,.25)}
.room-tabs button.on{background:var(--butter)}
.room-tabs button:disabled{opacity:.45}
.pet2d{position:absolute;left:50%;bottom:8%;width:min(60%,240px);aspect-ratio:1;transform:translateX(-50%)}
.pet2d svg{width:100%;height:100%}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0 30%,rgba(255,246,200,.85) 60%,rgba(255,255,255,0) 100%);opacity:0;pointer-events:none;z-index:7}
.flash.go{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:0}35%{opacity:.55}100%{opacity:0}}
.tags{position:absolute;inset:0;pointer-events:none;z-index:4}
.news{background:var(--soft);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 2px var(--line) inset;margin-bottom:10px}
.news.new{background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset}
.news-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.news-h b{font-family:var(--display);font-weight:400;font-size:17px}
.news-h span{font-size:13px;color:var(--muted)}
.news ul{margin:6px 0 0;padding-left:18px;line-height:1.6;font-size:14px}
.mission .candy + .candy{margin-left:-4px}
.quest{position:absolute;left:66px;right:10px;bottom:10px;z-index:6;display:flex;align-items:center;gap:8px;border:0;text-align:left;background:rgba(255,255,255,.95);border-radius:16px;padding:7px 8px 7px 12px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.25);color:var(--ink)}
.q-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.q-ch{font-size:13px;color:var(--muted)}
.q-tx b{font-family:var(--display);font-weight:400;font-size:15px}
.q-tx em{font-style:normal;color:#E8476A;font-variant-numeric:tabular-nums}
.q-go{flex:none;font-family:var(--display);font-size:14px;background:var(--butter);border-radius:10px;padding:6px 10px;box-shadow:0 0 0 2px var(--ink) inset;white-space:nowrap}
.chapter{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:9;text-align:center;background:var(--paper);border-radius:22px;padding:14px 22px;box-shadow:0 0 0 3px var(--ink) inset,0 6px 0 rgba(53,67,90,.25);animation:popin .45s cubic-bezier(.3,1.7,.5,1);display:flex;flex-direction:column;gap:2px;pointer-events:none;min-width:220px}
.chapter b{font-family:var(--display);font-weight:400;font-size:26px}
.chapter span{font-size:14px;color:var(--muted)}
.ev-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.swatch.dye{width:56px;height:56px;border-radius:50%}
.emote-btn{position:absolute;left:10px;bottom:10px;z-index:6;width:48px;height:48px;border-radius:50%;border:0;font-size:26px;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.25)}
.emote-tray{position:absolute;left:10px;bottom:66px;z-index:7;display:flex;gap:6px;background:var(--paper);border-radius:18px;padding:6px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.2)}
.emote-tray button{border:0;background:var(--soft);border-radius:12px;width:52px;padding:6px 0 4px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:1px}
.emote-tray small{font-family:var(--display);font-size:13px}
.cook-btn{width:100%;margin-bottom:12px;background:#FFE0C7}
.pantry{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pan{font-family:var(--display);font-size:15px;background:var(--soft);border-radius:99px;padding:4px 10px;box-shadow:0 0 0 2px var(--line) inset;font-variant-numeric:tabular-nums}
.item.off{opacity:.45}
.pot{font-size:64px;line-height:1.1}
.pot.stir{animation:wobble .35s ease}
.obby-ui{position:absolute;inset:0;z-index:8;pointer-events:none}
.ob-top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;justify-content:flex-end;pointer-events:auto}
.ob-top .pill{font-size:15px;padding:5px 10px;background:rgba(255,255,255,.92)}
.ob-tip{position:absolute;top:60px;left:16px;right:16px;margin:0;text-align:center;font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.joy{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 3px rgba(53,67,90,.55) inset;pointer-events:auto;touch-action:none;display:grid;place-items:center}
.joy i{width:56px;height:56px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 3px var(--ink) inset,0 4px 0 rgba(53,67,90,.3)}
.jump-btn{position:absolute;right:18px;bottom:24px;width:110px;height:110px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 6px 0 #B54A60,0 0 0 4px #fff inset;pointer-events:auto;touch-action:none}
.jump-btn.on{transform:translateY(4px);box-shadow:0 2px 0 #B54A60,0 0 0 4px #fff inset}
#obResult{z-index:9}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.badge-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:var(--soft);border-radius:18px;padding:10px 6px;box-shadow:0 0 0 2px var(--line) inset;opacity:.6}
.badge-card.got{opacity:1;background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset}
.badge-card .be{font-size:32px}
.badge-card b{font-family:var(--display);font-weight:400;font-size:14px}
.badge-card small{font-size:13px;color:var(--muted);line-height:1.35}
.mbtn{position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#E8476A;color:#fff;font-size:13px;font-family:var(--display);display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.msub{margin:0 0 10px;color:var(--muted);font-size:13px}
.missions{display:grid;gap:8px}
.mission{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:18px;padding:10px 12px;box-shadow:0 0 0 2px var(--line) inset}
.mission.done{background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset}
.mission.bonus{margin-top:10px}
.mi{font-size:26px;flex:none}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mt b{font-weight:400;font-family:var(--display);font-size:15px}
.mt small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{height:8px;border-radius:9px;background:#fff;box-shadow:0 0 0 1.5px var(--ink);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--mint)}
.mission .candy{padding:6px 10px;font-size:14px;white-space:nowrap;flex:none}
.mclaimed{font-family:var(--display);font-size:13px;color:#2FA36B;flex:none}
.dbtns{display:flex;gap:4px}
.mini-btn{border:0;border-radius:10px;padding:4px 9px;font-family:var(--display);font-size:13px;background:#fff;box-shadow:0 0 0 2px var(--ink) inset}
.mini-btn.buy{background:var(--butter)}
.place-bar{position:absolute;left:8px;right:8px;bottom:10px;z-index:7;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.2);font-size:14px}
.place-bar span{flex:1;min-width:0}
.place-bar .candy{padding:6px 12px;font-size:15px;flex:none}
.set-list{display:grid;gap:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;border:0;width:100%;text-align:left;background:var(--soft);border-radius:16px;padding:14px 16px;font-size:16px;box-shadow:0 0 0 2px var(--line) inset}
.set-row b{font-family:var(--display);font-weight:400}
.parent h4{font-family:var(--display);font-weight:400;font-size:16px;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:14px;background:var(--soft);box-shadow:0 0 0 2px var(--line) inset}
.seg button.on{background:var(--butter);box-shadow:0 0 0 2.5px var(--ink) inset}
.rest{position:absolute;inset:0;z-index:100;background:linear-gradient(#3B3F86,#6E5BA8);display:grid;place-items:center;padding:20px;animation:fade .4s}
.rest-card{background:var(--paper);border-radius:28px;padding:22px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 0 2.5px var(--ink) inset,0 8px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px}
.rest-pet{width:150px;height:150px;margin:0 auto}
.rest-pet svg{width:100%;height:100%}
.rest-card h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.rest-card p{margin:0;line-height:1.6}
.gate-wrap{position:absolute;inset:0;z-index:120;background:rgba(53,67,90,.45)}
.gq{font-family:var(--display);font-size:32px}
#gateIn{font:inherit;font-size:24px;text-align:center;padding:10px;border-radius:14px;border:0;box-shadow:0 0 0 2.5px var(--ink) inset;user-select:text;-webkit-user-select:text;color:var(--ink);background:#fff}
#villageTabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;pointer-events:auto;padding-bottom:4px}
#villageTabs::-webkit-scrollbar{display:none}
#villageTabs button{flex:none}
.talk-face img,.dex-card .art img{width:100%;height:100%;display:block;object-fit:contain}
.race-ui{position:absolute;inset:0;z-index:9;pointer-events:none}
.race-count{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:72px;color:#fff;text-shadow:0 4px 0 var(--ink),0 0 20px rgba(53,67,90,.35)}
.race-tip{position:absolute;bottom:176px;left:0;right:0;margin:0;text-align:center;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.race-btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);pointer-events:auto;width:148px;height:148px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:26px;line-height:1.2;box-shadow:0 6px 0 #B54A60,0 0 0 4px #fff inset;touch-action:none}
.race-btn.on{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #B54A60,0 0 0 4px #fff inset}
.race-btn:disabled{opacity:.55}
.mallow{width:76px;height:60px;border-radius:26px;margin:2px auto;box-shadow:0 0 0 3px var(--ink) inset,0 6px 0 rgba(53,67,90,.15);transition:background .1s}
.heat{position:relative;height:18px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.heat i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFE27A,#FF8A3D,#9A5B2E)}
.heat .gold{position:absolute;top:0;bottom:0;left:60%;width:25%;box-shadow:0 0 0 2.5px #2FA36B inset;background:rgba(126,217,195,.25)}
#rHold{touch-action:none;font-size:19px;padding:14px}
#rHold.on{transform:translateY(3px)}
.ntag{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:13px;background:rgba(255,255,255,.92);padding:2px 9px;border-radius:99px;box-shadow:0 0 0 2px var(--ink) inset;white-space:nowrap}
.ntag i{font-style:normal;color:#E8476A}
.fade{position:absolute;inset:0;background:#FFF6E9;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}
.fade.on{opacity:1}
.talk{position:absolute;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -2.5px 0 var(--ink),0 -10px 30px rgba(53,67,90,.15);padding-block:14px max(16px,env(safe-area-inset-bottom,0px));animation:slideup .25s cubic-bezier(.2,1.2,.4,1)}
.talk-head{display:flex;align-items:center;gap:10px}
.talk-face{width:60px;height:60px;flex:none;border-radius:18px;background:var(--soft);box-shadow:0 0 0 2px var(--ink) inset;padding:2px}
.talk-face svg{width:100%;height:100%}
.talk-who{display:flex;flex-direction:column;min-width:0}
.talk-name{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.talk-job{font-size:13px;color:var(--muted)}
.talk-hearts{margin-left:auto;color:#E8476A;font-size:16px;letter-spacing:1px;white-space:nowrap}
.talk-text{font-size:17px;line-height:1.6;margin:10px 0 12px;min-height:3.3em;cursor:pointer;text-wrap:pretty}
.talk-choices{display:grid;gap:8px}
.talk-choices .candy{text-align:left;font-size:16px;padding:10px 14px}
.form-chip{display:inline-block;margin-left:4px;font-size:13px;padding:1px 7px;border-radius:99px;background:var(--butter);box-shadow:0 0 0 1.5px var(--ink) inset;white-space:nowrap}
.eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.chomp{animation:chomp .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.spark{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bubble{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:max-content;max-width:min(84%,330px);background:var(--paper);padding:9px 15px;border-radius:18px;box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.18);font-size:15px;line-height:1.45;text-align:center;z-index:4;transition:opacity .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--paper);transform:translateX(-50%) rotate(45deg);box-shadow:2.5px 2.5px 0 var(--ink);border-radius:0 0 4px 0}
.bubble.pop{animation:popin .35s cubic-bezier(.3,1.7,.5,1)}
.night{position:absolute;inset:0;background:radial-gradient(#FFF6C8 1.4px,transparent 1.8px) 0 0/46px 52px,radial-gradient(#FFF6C8 1px,transparent 1.4px) 23px 26px/46px 52px,rgba(38,40,92,.22);opacity:0;pointer-events:none;transition:opacity .9s;z-index:3}
.room.sleeping .night{opacity:1}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.p{position:absolute;font-size:26px;transform:translate(-50%,-50%);animation:floatup 1.2s ease-out forwards;white-space:nowrap}
.p.zz{font-family:var(--display);color:#FFF6C8;font-size:24px;animation:zz 2.2s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.p.plus{font-family:var(--display);font-size:18px;color:var(--ink);background:#fff;padding:1px 9px;border-radius:99px;box-shadow:0 0 0 2px var(--ink) inset}
.p.bub{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(190,235,255,.55) 22%,rgba(150,215,245,.35));box-shadow:0 0 0 1.5px rgba(120,190,230,.8) inset;animation:bubble 1s ease-out forwards}
.p.crumb{font-size:14px;animation:crumb .7s ease-in forwards}
.flyfood{position:absolute;font-size:40px;z-index:6;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.3,-.6,.6,1),transform .55s;transform:translate(-50%,-50%)}
.sponge{position:absolute;font-size:42px;z-index:6;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg)}
.bath-bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:99px;padding:6px 6px 6px 16px;box-shadow:0 0 0 2.5px var(--ink) inset;z-index:7;white-space:nowrap;font-size:14px}
.bath-bar .candy{padding:6px 12px;font-size:15px}

.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding-block:10px max(12px,env(safe-area-inset-bottom,0px));background:var(--soft)}
.act{border:0;border-radius:18px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);box-shadow:0 4px 0 var(--sh),0 0 0 2.5px var(--ink) inset;font-family:var(--display);font-size:14px;transition:transform .08s;min-height:62px}
.act .ic{font-size:25px;line-height:1.1}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh),0 0 0 2.5px var(--ink) inset}
.act:disabled{opacity:.4;transform:none;cursor:default}

/* ---------- 바텀 시트 ---------- */
.scrim{position:absolute;inset:0;background:rgba(53,67,90,.38);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:82%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;box-shadow:0 -2.5px 0 var(--ink);padding-block:16px max(20px,env(safe-area-inset-bottom,0px));animation:slideup .28s cubic-bezier(.2,1.2,.4,1)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.item{border:0;background:var(--soft);border-radius:20px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 0 0 2px var(--line) inset;position:relative}
.item:active{transform:scale(.96)}
.item .em{font-size:38px;line-height:1.15}
.item .art{width:72px;height:60px}
.item .art svg{width:100%;height:100%}
.item .nm{font-family:var(--display);font-size:15px}
.item .pr{font-size:13px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.item .eff{font-size:13px;color:var(--muted)}
.item.on{box-shadow:0 0 0 3px var(--ink) inset;background:#FFF7D6}
.item.fav::before{content:"최애";position:absolute;top:6px;right:6px;font-size:13px;font-family:var(--display);background:var(--coral);color:#fff;border-radius:99px;padding:1px 6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs button{flex:1 0 auto;white-space:nowrap;border:0;border-radius:14px;padding:8px 9px;font-family:var(--display);font-size:15px;background:var(--soft);box-shadow:0 0 0 2px var(--line) inset}
.tabs button[aria-selected="true"]{background:var(--butter);box-shadow:0 0 0 2.5px var(--ink) inset}
.swatch{width:72px;height:52px;border-radius:12px;box-shadow:0 0 0 2px var(--ink) inset}
.dex{display:grid;gap:10px}
.dex-card{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:20px;padding:10px 12px;box-shadow:0 0 0 2px var(--line) inset;text-align:left;border:0;width:100%}
.dex-card.cur{box-shadow:0 0 0 3px var(--ink) inset;background:#FFF7D6}
.dex-card .art{width:70px;height:70px;flex:none}
.dex-card .art svg{width:100%;height:100%}
.dex-card .txt{flex:1;min-width:0}
.dex-card .t1{font-family:var(--display);font-size:18px}
.dex-card .t2{font-size:13px;color:var(--muted);line-height:1.45}
.sil{filter:brightness(0);opacity:.16}
.dex-card .go{font-family:var(--display);font-size:13px;padding:6px 10px;border-radius:12px;background:var(--paper);box-shadow:0 0 0 2px var(--ink) inset;white-space:nowrap;display:flex;align-items:center;gap:4px}

/* ---------- 미니게임 ---------- */
#game{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:#BFE8FF}
.g-top{display:flex;align-items:center;gap:8px;padding-block:12px 8px;background:var(--paper);border-bottom:2.5px solid var(--ink)}
.g-top .ttl{flex:1;font-family:var(--display);font-size:19px}
#gCanvas{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.g-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,330px);background:var(--paper);border-radius:26px;padding:20px 18px;box-shadow:0 0 0 2.5px var(--ink) inset,0 6px 0 rgba(53,67,90,.25);text-align:center;display:flex;flex-direction:column;gap:10px;animation:popin .35s cubic-bezier(.3,1.7,.5,1)}
.g-card h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.g-card p{margin:0;line-height:1.55}
.legend{display:flex;justify-content:center;gap:12px;font-size:13px;flex-wrap:wrap}
.big-score{font-family:var(--display);font-size:54px;line-height:1}

.toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 60px));visibility:hidden;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-family:var(--display);font-size:16px;z-index:50;transition:transform .35s cubic-bezier(.3,1.5,.5,1);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.show{transform:translate(-50%,0);visibility:visible}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.cf{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:cf 1.9s cubic-bezier(.2,.6,.4,1) forwards}

/* ---------- 추억의 오락실 (밤하늘 오락기 화면) ---------- */
#game.arcade{background:#1B1A3D}
.arcade .g-top{background:#2A2858;color:#FFF6C8;border-bottom-color:#0E0D24}
.arcade .g-top .pill,.arcade .g-top .icon-btn{background:#14132E;color:#FFF6C8;box-shadow:0 0 0 2px #FFE27A inset}
.a-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;padding:8px}
.a-stage canvas{display:block;border-radius:14px;box-shadow:0 0 0 3px #FFE27A,0 0 26px rgba(255,226,122,.35);touch-action:none}
.a-stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.1) 2px 3px)}
.pad{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px max(14px,env(safe-area-inset-bottom,0px));background:#2A2858;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px}
.pbtn{border:0;border-radius:14px;background:#4B48A0;color:#FFF6C8;font-size:22px;box-shadow:0 4px 0 #14132E;touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn.on{transform:translateY(3px);box-shadow:0 1px 0 #14132E;background:#6461C8}
.abtn{flex:none;width:92px;height:92px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:20px;box-shadow:0 5px 0 #B54A60,0 0 0 3px #FFF6C8 inset;touch-action:none;-webkit-user-select:none;user-select:none}
.abtn.on{transform:translateY(4px);box-shadow:0 1px 0 #B54A60,0 0 0 3px #FFF6C8 inset}
.arcade-head{font-family:var(--display);font-size:18px;margin:10px 0 0;display:flex;align-items:center;gap:8px}
.arcade-tag{font-family:var(--body);font-size:13px;background:#2A2858;color:#FFE27A;border-radius:99px;padding:2px 8px}
.dex-card .emo{width:70px;height:70px;flex:none;display:grid;place-items:center;font-size:38px;border-radius:18px;background:#2A2858;box-shadow:0 0 0 2px #FFE27A inset}
.dex-card .emo.day{background:#BFE8FF;box-shadow:0 0 0 2px var(--ink) inset}
@media (max-width:360px){.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px)}.abtn{width:80px;height:80px;font-size:18px}}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-10px) scale(.97,1.03)}55%{transform:translateY(0) scale(1.05,.95)}}
@keyframes jump{0%{transform:scale(1,1)}20%{transform:scale(1.1,.88)}50%{transform:translateY(-16%) scale(.94,1.07)}80%{transform:scale(1.06,.94)}100%{transform:scale(1,1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}85%{transform:rotate(-3deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes chomp{to{transform:scaleY(.3)}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-260%) scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(-50%,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + 40px),-120px) scale(1.3)}}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-220%) scale(1.1)}}
@keyframes crumb{0%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),60px) rotate(120deg)}}
@keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.bubble.pop{animation-name:bpop}
@keyframes bpop{0%{opacity:0;transform:translateX(-50%) scale(.7)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(12deg)}30%{transform:rotate(0)}}
@keyframes blinkbar{50%{box-shadow:0 0 0 2px var(--coral)}}
@keyframes fade{from{opacity:0}}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:370px){.act{font-size:13px}.act .ic{font-size:21px}.logo{font-size:36px}}
/* 작은 화면: 방(무대)이 가려지지 않도록 위아래 여백과 버튼 높이를 줄인다 */
@media (max-width:360px){.room-tabs button{padding:4px 8px;font-size:13px}.quest{left:62px;padding:6px 6px 6px 10px}.q-tx b{font-size:14px}.pill{font-size:15px;padding:5px 10px}.icon-btn{width:36px;height:36px;font-size:17px}}
@media (max-height:640px){.top{padding-block:8px 4px}.who h1{font-size:21px}.stats{padding-block:2px 6px;gap:4px 12px}.act{min-height:54px;padding:5px 0 4px}.act .ic{font-size:21px}.room{min-height:190px}.joy{width:112px;height:112px}.jump-btn{width:96px;height:96px;font-size:21px}.race-btn{width:124px;height:124px}.race-tip{bottom:150px}}
/* 키보드로 3D 방을 고를 때 보이는 테두리 */
#world:focus-visible{outline:3px solid #4BB8A0;outline-offset:-4px}
.g-card button:focus-visible,.talk button:focus-visible,.sheet button:focus-visible{outline:3px solid #4BB8A0;outline-offset:2px}
.mini-quit{border:0;background:none;font-family:var(--display);font-size:14px;color:var(--muted);padding:4px;align-self:center}
.photo-btn{position:absolute;left:10px;bottom:66px;z-index:6;width:48px;height:48px;border-radius:50%;border:0;font-size:24px;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.25)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.album button{border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 2px var(--line) inset;aspect-ratio:4/5}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.photo-view{display:flex;flex-direction:column;gap:10px;align-items:center}
.photo-view img{width:100%;max-width:360px;border-radius:14px;box-shadow:0 0 0 2.5px var(--ink)}
.photo-view .row{display:flex;gap:8px;width:100%;max-width:360px}
.photo-view .row .candy{flex:1}
.backup textarea{width:100%;min-height:96px;font:12px/1.4 ui-monospace,Consolas,monospace;border:0;border-radius:12px;padding:10px;box-shadow:0 0 0 2px var(--line) inset;background:var(--soft);color:var(--ink);user-select:text;-webkit-user-select:text;word-break:break-all;resize:vertical}
.backup .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.backup .row .candy{flex:1;min-width:120px;font-size:15px}
.warn{background:#FFF1D6;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-top:8px}
.jump-mini{position:absolute;right:10px;bottom:66px;z-index:6;width:58px;height:58px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-family:var(--display);font-size:16px;box-shadow:0 5px 0 #B54A60,0 0 0 3px #fff inset;touch-action:manipulation}
.jump-mini:active{transform:translateY(3px);box-shadow:0 2px 0 #B54A60,0 0 0 3px #fff inset}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.stk{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--soft);border-radius:14px;padding:8px 2px 6px;box-shadow:0 0 0 2px var(--line) inset;font-size:13px;color:var(--muted)}
.stk b{font-size:28px;line-height:1.1;font-weight:400}
.stk.got{background:#FFF7D6;box-shadow:0 0 0 2.5px var(--ink) inset;color:var(--ink)}
.gift-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.gift-row span{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--soft);box-shadow:0 0 0 1.5px var(--line) inset}
.gift-row span.got{background:var(--butter);box-shadow:0 0 0 2px var(--ink) inset}
.no3d{position:absolute;left:10px;right:10px;top:52px;z-index:6;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 2.5px var(--ink) inset;font-size:13px;line-height:1.5}
.no3d b{font-family:var(--display);font-weight:400;font-size:16px}
.no3d em{font-style:normal;color:#E8476A}
.ptitle{display:inline-block;margin-top:2px;font-family:var(--display);font-size:13px;padding:1px 8px;border-radius:99px;background:var(--butter);box-shadow:0 0 0 1.5px var(--ink) inset;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wear-h{font-family:var(--display);font-size:16px;margin:14px 0 8px}
.wear-h:first-child{margin-top:0}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.titles button{border:0;border-radius:99px;padding:6px 11px;font-family:var(--display);font-size:13.5px;background:var(--soft);box-shadow:0 0 0 2px var(--line) inset}
.titles button.on{background:var(--butter);box-shadow:0 0 0 2.5px var(--ink) inset}
.titles button:disabled{opacity:.5}
.titles small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.ride-btn{position:absolute;right:10px;bottom:132px;z-index:6;width:54px;height:54px;border-radius:50%;border:0;font-size:26px;background:var(--paper);box-shadow:0 0 0 2.5px var(--ink) inset,0 4px 0 rgba(53,67,90,.25)}
.ride-btn.on{background:var(--butter)}
.round-ui{position:absolute;top:52px;left:10px;right:10px;z-index:8;display:flex;align-items:center;gap:6px;justify-content:center;pointer-events:none}
.round-ui .pill{background:rgba(255,255,255,.95);font-size:16px;pointer-events:auto}
.round-ui .icon-btn{pointer-events:auto}
.round-big{position:absolute;top:30%;left:50%;transform:translateX(-50%);z-index:9;font-family:var(--display);font-size:64px;color:#fff;text-shadow:0 4px 0 var(--ink),0 0 20px rgba(53,67,90,.35);pointer-events:none;white-space:nowrap}
.round-tip{position:absolute;top:96px;left:16px;right:16px;z-index:8;margin:0;text-align:center;font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink);pointer-events:none}
.room.duo .photo-btn,.room.duo .emote-btn,.room.duo .jump-mini,.room.duo .ride-btn,.room.duo .quest,.room.duo .bubble{display:none!important}
.ntag.p1{background:#FFD3DE}.ntag.p2{background:#CDEBFF}.ntag.pal{background:#FFF1A8}
.pal-code{width:100%;min-height:72px;font:12px/1.4 ui-monospace,Consolas,monospace;border:0;border-radius:12px;padding:10px;box-shadow:0 0 0 2px var(--line) inset;background:var(--soft);color:var(--ink);user-select:text;-webkit-user-select:text;word-break:break-all;resize:vertical}
.pal-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.pal-table th,.pal-table td{padding:6px 4px;border-bottom:1.5px solid var(--line);text-align:center;font-weight:400}
.pal-table td.me{font-family:var(--display)}
.room.duo,.room.inobby{touch-action:none}
body{-webkit-touch-callout:none}
.finger-dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(53,67,90,.5) inset;pointer-events:none;z-index:6}
.finger-dot.p2{background:rgba(126,200,242,.45)}
.duo-zones{position:absolute;inset:auto 0 0 0;height:38%;z-index:5;display:flex;pointer-events:none}
.duo-zones span{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-family:var(--display);font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink)}

    if (!pt.legL) return;

    }
    if (o.air) { alx = arx = -.25; alz = -1.5; arz = 1.5; lx = -.55; rx = .35; }
    if (o.eat) { alx = arx = -1.75; alz = .45; arz = -.45; }
    switch (o.act) {
      case 'wave': arx = -.3; arz = 1.95 + Math.sin(k * 10) * .3; alx = 0; break;
      case 'dance': { const d = Math.sin(k * 7); alx = -1.1 + d * .55; arx = -1.1 - d * .55; alz = -.65; arz = .65; lx = Math.max(0, d) * .32; rx = Math.max(0, -d) * .32; fast = true; break; }
      case 'spin': alz = -1.5; arz = 1.5; alx = arx = 0; lx = -.2; rx = .2; break;
      case 'jump': case 'hop': alx = arx = -.25; alz = -1.5; arz = 1.5; lx = -.55; rx = .35; break;
      case 'transform': alx = arx = -.3; alz = -1.7; arz = 1.7; lx = rx = 0; break;
      case 'talk': arx = -.9 + Math.sin(t * 5) * .16; arz = .55; break;
      case 'sad': alx = arx = .22; alz = -.1; arz = .1; break;
      case 'surprise': alx = arx = -.2; alz = -2; arz = 2; lx = -.2; rx = .2; break;
      case 'explain': arx = -1.05 + Math.sin(k * 5) * .2; arz = .6; alx = -.15; break;
      case 'cheer': { const d = Math.sin(k * 5); alx = arx = -.15; alz = -2.2 + d * .3; arz = 2.2 - d * .3; lx = Math.max(0, d) * .3; rx = Math.max(0, -d) * .3; break; }

    if (pt.armZ !== false) { go(pt.armL, 'z', alz); go(pt.armR, 'z', arz); }

  function animateVillage(dt) {
    const t = st.t;
    movePals(dt);
    for (const n of Object.values(npcs)) {
      const p = n.parts, dx = st.x - (VX + n.x), dz = st.z - n.z, near = Math.hypot(dx, dz) < 3.2;
      n.t += dt;
      if (n.hidden) { p.root.visible = false; n.tag.hidden = true; continue; }
      p.root.visible = true;
      if (n.fleeing) {
        // 술래잡기: 가까이 오면 반대쪽으로 달아나고(조금씩 방향을 틀며), 벽에 막히면 옆으로 비켜 달린다
        const d = Math.hypot(dx, dz);
        if (n.caught) { n.walk = false; n.faceGoal = Math.atan2(dx, dz); }
        else if (d < 1.25) { n.caught = true; n.jumpT = .6; n.walk = false; onTagged && onTagged(n.id); }
        else {
          let ax, az, sp;
          if (d < 7) { const w = Math.sin(n.t * 1.7 + n.hx) * .6, ux = -dx / d, uz = -dz / d; ax = ux * Math.cos(w) - uz * Math.sin(w); az = ux * Math.sin(w) + uz * Math.cos(w); sp = n.flee; }
          else { ax = Math.sin(n.t * .5 + n.hz); az = Math.cos(n.t * .5 + n.hx); sp = 1.4; }
          let [nx, nz] = clampVillage(n.x + ax * sp * dt, n.z + az * sp * dt);
          if (Math.hypot(nx - n.x, nz - n.z) < sp * dt * .4) { const sd = Math.sin(n.t * 3 + n.hx) > 0 ? 1 : -1; [nx, nz] = clampVillage(n.x + az * sd * sp * dt * 1.2, n.z - ax * sd * sp * dt * 1.2); }
          n.faceGoal = Math.atan2(nx - n.x, nz - n.z); n.x = nx; n.z = nz; n.walk = true;
        }
      }
      else if (n.racing) { n.walk = !!race && race.t >= 0; n.faceGoal = Math.PI; }
      else if (n.follow && !n.talking) {
        const bx = st.x - VX - Math.sin(st.face) * 1.5 + Math.cos(st.face) * .9, bz = st.z - Math.cos(st.face) * 1.5 - Math.sin(st.face) * .9;
        const ex = bx - n.x, ez = bz - n.z, d = Math.hypot(ex, ez);
        if (d > .35) { const sp = Math.min(d, (d > 3 ? 4.2 : 2.2) * dt); n.x += ex / d * sp; n.z += ez / d * sp; n.faceGoal = Math.atan2(ex, ez); n.walk = true; }
        else { n.walk = false; n.faceGoal = st.face; }
      }
      else if (n.talking || near) { n.walk = false; n.faceGoal = Math.atan2(dx, dz); }
      else {
        n.wt -= dt;
        if (n.wt <= 0) { [n.tx, n.tz] = clampVillage(n.hx + rand(-1.3, 1.3), n.hz + rand(-1, 1)); n.wt = rand(3, 7); }
        const ex = n.tx - n.x, ez = n.tz - n.z, d = Math.hypot(ex, ez);
        if (d > .05) { const sp = Math.min(d, .9 * dt); n.x += ex / d * sp; n.z += ez / d * sp; n.faceGoal = Math.atan2(ex, ez); n.walk = true; } else { n.walk = false; n.faceGoal = 0; }
      }
      n.face = turn(n.face, n.faceGoal, dt * 6);
      const cyc = n.t * 8, s = n.walk ? Math.cos(cyc * 2) * .04 : Math.sin(n.t * 2.2) * .02;
      p.root.position.set(VX + n.x, n.walk ? Math.abs(Math.sin(cyc)) * .12 : (n.talking ? Math.abs(Math.sin(n.t * 5)) * .05 : 0), n.z);
      p.root.rotation.set(0, n.face, n.walk ? Math.sin(cyc) * .06 : 0);
      p.body.scale.set(1 + s, 1 - s, 1 + s); p.body.rotation.x = LOOK_UP;
      if (n.jumpT > 0) { n.jumpT -= dt; p.root.position.y += Math.sin((1 - n.jumpT / .6) * Math.PI) * .8; }
      poseLimbs(p, dt, { walk: n.walk, run: !!(n.fleeing || n.racing), cyc, t: n.t, air: n.jumpT > 0, act: n.talking ? 'talk' : null });
      if (p.footL) { p.footL.position.y = p.footBase + (n.walk ? Math.max(0, Math.sin(cyc)) * .1 : 0); p.footR.position.y = p.footBase + (n.walk ? Math.max(0, -Math.sin(cyc)) * .1 : 0); }
      if (p.earL) { const sw = Math.sin(n.t * 2.5) * .06; p.earL.rotation.z = p.earBase + sw; p.earR.rotation.z = -p.earBase - sw; }
      if (p.tail) p.tail.rotation.y = Math.sin(n.t * 5) * .35;
      if (p.wingL) { const f = Math.sin(n.t * 5) * .3; p.wingL.rotation.y = p.wingBase + f; p.wingR.rotation.y = -p.wingBase - f; }
      if (p.flL) { const f = Math.sin(n.t * 2) * .1; p.flL.rotation.z = -p.flBase - f - (n.talking ? Math.abs(Math.sin(n.t * 6)) * .6 : 0); p.flR.rotation.z = p.flBase - f; }
      n.blink -= dt; if (n.blink < 0) n.blink = rand(2.5, 5);
      if (p.eyesOpen) p.setFace(n.blink < .12 ? 'sleep' : (n.talking ? 'happy' : 'normal'));
      // 이름표
      const v = new T.Vector3(VX + n.x, 2.6, n.z).project(camera);
      const on = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
      n.tag.hidden = !on;
      if (on) { n.tag.style.left = (v.x + 1) / 2 * room.clientWidth + 'px'; n.tag.style.top = (1 - v.y) / 2 * room.clientHeight + 'px'; n.tag.querySelector('i').textContent = friendAlert(n.id) ? ' ❗' : ''; }
    }
    for (const d of drops) { const k = (t * .7 + d.ph) % 1; d.m.position.set(VX + Math.cos(d.a) * k * 1.4, 1.85 + Math.sin(k * Math.PI) * .9 - k * .9, -1.5 + Math.sin(d.a) * k * 1.4); }
    for (const s of swings) s.piv.rotation.x = Math.sin(t * 2 + s.ph) * .35;
    for (const f of flies) { const a = t * f.sp + f.ph; f.bf.position.set(VX + f.cx + Math.cos(a) * f.r, 1.2 + Math.sin(a * 3) * .3, f.cz + Math.sin(a) * f.r); f.bf.rotation.y = -a; const w = Math.sin(t * 22 + f.ph) * .9; f.wl.rotation.z = w; f.wr.rotation.z = -w; }
    for (const [i, f] of flames.entries()) f.scale.y = (i ? .5 : .8) * (1 + Math.sin(t * 13 + i) * .12 + Math.sin(t * 29) * .06);
    if (fireLight) fireLight.intensity = 1 + Math.sin(t * 17) * .2;
    if (blades) blades.rotation.z += dt * .8;
    if (sea) sea.position.y = .03 + Math.sin(t * 1.3) * .03;
    for (let i = candies.length - 1; i >= 0; i--) {
      const c = candies[i]; c.position.y = .6 + Math.sin(t * 3 + i) * .12;
      if (Math.hypot(c.position.x - st.x, c.position.z - st.z) < 1.2) { villageG.remove(c); candies.splice(i, 1); onCandy && onCandy(c.userData.idx); }
    }
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i]; s.position.y = .55 + Math.sin(t * 3 + i) * .1;
      if (Math.hypot(s.position.x - st.x, s.position.z - st.z) < 1.2) { villageG.remove(s); shells.splice(i, 1); sfx('coin'); onShell && onShell(shells.length); }

/* =========================================================
   9. 돌보기 행동
   ========================================================= */
let lastPat = 0;
// 3D 화면에서 누른 것: 펫 → 쓰다듬기, 가구 → 그 가구로 할 일, 바닥 → 그쪽으로 걸어가기
World.onTap = hit => {
  const p = P(); if (!p) return;
  const u = hit.o.userData;
  if (placing) { if (World.area() === 'house') placeAt(hit.point.x, hit.point.z); return; }
  if (u.pet) return patPet();
  if (!p.hatched) return say(u.use === 'door' ? '알에서 깨어나면 같이 나가요!' : idleLine(), 3000);
  if (talking) return;
  if (u.comp !== undefined) { World.compJump(u.comp); return switchPet(u.comp); }
  if (u.use && u.use.startsWith('pal:')) return round ? null : openPal(+u.use.slice(4));
  if (u.use === 'stand') return goStand();
  if (u.npc) return round ? null : World.hidden(u.npc) ? hideGuess(-1) : talkTo(u.npc);
  if (u.use === 'home') return World.goHome();
  if (u.use && u.use.startsWith('water:')) return waterBed(+u.use.slice(6));
  if (u.use && u.use.startsWith('bush:')) return hideGuess(+u.use.slice(5));
  if (u.use && u.use.startsWith('plot:')) return tapPlot(+u.use.slice(5));
  if (u.use === 'portal') return World.goVillage('portal', true, startObby);
  if (u.use && u.use.startsWith('bld:')) return World.goVillage(u.use.slice(4), true);
  if (u.use) return useThing(u.use);
  if (u.floor && !p.asleep) {
    const st = World.st, far = Math.hypot(hit.point.x - st.x, hit.point.z - st.z) > 4;
    World.goTo(hit.point.x, hit.point.z, far);
    particle('✨', hit.sx, hit.sy, 'plus');
  }
};
// 키보드로 3D 방 조작: 방향키 = 그쪽으로 몇 걸음, Enter·스페이스 = 쓰다듬기(알이면 톡톡). 점프 코스는 따로 키를 받는다
$('#world').addEventListener('keydown', e => {
  const p = P(); if (!p || talking || bathing || placing || World.area() === 'obby' || $('#home').hidden) return;
  if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat) patPet(); }
});
// 방향키·WASD = 직접 달리기, 스페이스 = 점프. 창이 떠 있거나 글자를 쓰는 중이면 받지 않는다 (점프 코스는 따로 받는다)
const driveKeys = {};
const DRIVE_MAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
function driveBlocked() {
  const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
  return typing || $('#home').hidden || World.area() === 'obby' || !!scrim || !!talking || gameOn || !!document.querySelector('.mini, .race-ui, .gate-wrap, .rest');
}
function applyDriveKeys() {
  const d = World.drive; d.x = (driveKeys.r ? 1 : 0) - (driveKeys.l ? 1 : 0); d.z = (driveKeys.d ? 1 : 0) - (driveKeys.u ? 1 : 0);
  const l = Math.hypot(d.x, d.z); if (l > 1) { d.x /= l; d.z /= l; }
}
const P2_MAP = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd' };
window.addEventListener('keydown', e => {
  if (driveBlocked()) return;
  if (round && round.duo && P2_MAP[e.key]) { e.preventDefault(); p2Keys[P2_MAP[e.key]] = true; return applyP2Keys(); }
  const k = DRIVE_MAP[e.key];
  if (k) { e.preventDefault(); driveKeys[k] = true; return applyDriveKeys(); }
  if ((e.key === 'r' || e.key === 'R') && !e.repeat) { e.preventDefault(); return toggleRide(); }
  if (e.key === ' ' && (document.activeElement === document.body || document.activeElement === $('#world'))) { e.preventDefault(); if (!e.repeat) doJump(); }
});
window.addEventListener('keyup', e => { if (P2_MAP[e.key] && p2Keys[P2_MAP[e.key]]) { p2Keys[P2_MAP[e.key]] = false; applyP2Keys(); } const k = DRIVE_MAP[e.key]; if (k && driveKeys[k]) { driveKeys[k] = false; applyDriveKeys(); } });
window.addEventListener('blur', () => { for (const k in driveKeys) driveKeys[k] = false; applyDriveKeys(); });
function doJump() {
  if (round && round.duo) return;
  const p = P(); if (!p || !p.hatched || p.asleep || bathing || World.area() === 'obby') return;
  World.trick('jump'); sfx('pop');
}
$('#jumpBtn').addEventListener('click', () => doJump());
$('#engBar').addEventListener('click', () => { sfx('tap'); if (talking) closeTalk(); openEnglish(); });
function useThing(use) {
  if (use.startsWith('decor:')) return useDecor(use.slice(6));
  if (use === 'cook') return openCook();
  const p = P();
  if (p.asleep && use !== 'sleep') return say('쿨쿨… (자고 있어요. 깨우려면 ☀️ 버튼!)', 3000);
  if (bathing && use !== 'bath') return;
  if (use === 'feed') return openFeed();
  if (use === 'bath') return bathing ? endBath() : startBath();
  if (use === 'sleep') return p.asleep ? wake(false) : sleep();
  if (use === 'play') { World.goSpot('arcade', true); return openPlayMenu(); }
  if (use === 'ball') return World.kickBall(true);
  if (use === 'door') return goOutside();
  if (use === 'sofa') return World.goSpot('sofa', true, () => { change({ fun: 2 }); say(pick(['폭신폭신 소파 최고!', '여기서 쉬어야지~']), 3000); render(); });
  if (use === 'tv') return World.goSpot('tv', true, () => { change({ fun: 3 }); say(pick(['뽀로롱~ 만화 재밌다!', '와, 우주 탐험 만화다!']), 3500); render(); });
}
// 걸어가는 도중 아이가 바닥을 눌러 길이 바뀌면 도착 신호가 오지 않는다. 이미 코인·재료를 썼으면 잠시 뒤 그 자리에서라도 마무리한다
function goSpotThen(name, cb, ms = 6000) {
  let done = false; const run = () => { if (!done) { done = true; cb(); } };
  World.goSpot(name, true, run); setTimeout(run, ms);
}
function goOutside() {
  const p = P();
  if (!p.hatched) return say('알에서 깨어나면 같이 나가요!', 3000);
  if (!areaOpen('village')) return say(areaLockMsg('village'), 4000);
  if (p.asleep) return say('쿨쿨… 아침이 되면 나가요', 3000);
  say('밖에 나가 볼까? 친구들이 기다려요!', 2500);
  World.goSpot('door', true, () => World.enterVillage());
}
$('#villageTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b || b.disabled || talking) return;
  sfx('tap');
  if (b.dataset.go === 'home') return World.goHome();
  if (!areaOpen(b.dataset.go)) return toast(areaLockMsg(b.dataset.go));
  if (b.dataset.go === 'portal') return World.goVillage('portal', true, startObby);
  World.goVillage(b.dataset.go, true);
});
$('#roomTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b || b.disabled) return;
  sfx('tap');
  if (b.dataset.go === 'door') return goOutside();
  World.goRoom(b.dataset.go);
  setTimeout(renderHUD, 1600);
});

function patPet() {
  const p = P(); if (!p || bathing) return;
  if (!p.hatched) return tapEgg();
  if (p.asleep) { const c = petCenter(-.3); particle('Z', c.x + 30, c.y, 'zz'); return say('쿨쿨… (자고 있어요. 깨우려면 ☀️ 버튼!)', 3000); }
  const now = Date.now();
  World.trick('jump');
  sfx('tap');
  if (now - lastPat < 600) return;
  lastPat = now;
  mission('pat');
  change({ fun: 3 }); addXP(1);
  burst(['💗', '💕', '✨'], 3, -.15);
  setMood('love', 1100);
  say(pick(['헤헤, 간지러워!', '더 쓰다듬어 줘~', '좋아좋아!', `${p.name} 행복해!`, '말랑말랑~']), 2500);
  render();
}

let hatchPending = false;
function tapEgg() {
  if (hatchPending) return;
  const p = P(); p.taps++;
  World.trick('wobble'); sfx('pop');
  if (p.taps >= HATCH_TAPS) {
    hatchPending = true;
    setTimeout(() => {
      hatchPending = false;
      p.hatched = true; p.taps = 0; badge('hatch'); setTimeout(() => story('hatch'), 300);
      sfx('hatch'); confetti(100);
      setMood('happy', 2500);
      render(); World.trick('jump'); burst(['✨', '⭐', '💖'], 8, -.2);
      say(`안녕! 나는 ${p.name}! 화면을 누른 채 가리키면 그쪽으로 달려가! 첫 영어 미션을 같이 해 보자!`, 7000);
      if (S.tut && S.tut.step === 'egg') { S.tut.step = 'lesson'; setTimeout(() => World.trick('explain'), 900); setTimeout(() => { if (!gameOn && !scrim) openEngAge(); }, 2200); }
      persist();
    }, 260);
  } else say(['톡! 알이 살짝 흔들려요', '안에서 꼼지락거려요!', '눈이 보여요! 조금만 더!', '거의 다 됐어요!'][p.taps - 1] + ` (${p.taps}/${HATCH_TAPS})`, 4000);
  render(); persist();
}

function feed(food) {
  const p = P();
  if (p.hunger >= 95) { closeSheet(); return say('배불러서 더는 못 먹어요~'); }
  if (S.coins < food.price) return toast('코인이 모자라요. 놀이에서 모아 봐요!');
  S.coins -= food.price;
  closeSheet(); renderHUD();
  const outside = World.area() === 'village';
  say(outside ? `${food.name} 소풍 도시락이다!` : `${food.name} 먹으러 부엌으로 고고!`, 3000);
  (outside ? (cb => setTimeout(cb, 300)) : (cb => goSpotThen('bowl', cb)))(() => {
    const isFav = SPECIES[p.sp].fav === food.id;
    World.eat(1.4, outside ? null : food.e); setMood('eat', 1400); sfx('eat');
    const c = petCenter(.1);
    for (let i = 0; i < 5; i++) setTimeout(() => particle(food.e, c.x + rand(-14, 14), c.y + 6, 'crumb'), i * 140);
    change({ hunger: food.hunger, fun: (food.fun || 0) + (isFav ? 10 : 0), energy: food.energy || 0 });
    setTimeout(() => {
      addXP(food.xp + (isFav ? 4 : 0));
      mission('feed'); if (isFav) mission('fav');
      if (isFav) { setMood('love', 1600); burst(['💖', '💗'], 5); say(`우와! ${food.name} 제일 좋아해요!`); World.trick('spin'); }
      else { setMood('happy', 1200); say(pick(['냠냠, 맛있어요!', '와구와구!', '배가 든든해요~'])); }
      render(); persist();
    }, 1450);
    render();
  });
}

let bathing = false, lastRub = 0;
const sponge = $('#sponge');
function startBath() {
  const p = P(); bathing = true;
  room.classList.add('bathing'); renderHUD();
  say('목욕하러 욕실로 가요!', 3000);
  World.goSpot('bath', true, () => {
    if (!bathing) return;
    sponge.hidden = false; $('#bathBar').hidden = false;
    say(p.clean >= 95 ? '이미 반짝반짝하지만 거품 놀이 좋아요!' : '거품 목욕이다! 스펀지로 쓱싹쓱싹~', 60000);
  });
}
function endBath() {
  bathing = false;
  room.classList.remove('bathing'); sponge.hidden = true; $('#bathBar').hidden = true;
  const p = P();
  World.leave('mat');
  if (p.clean >= 90) { setMood('happy', 1500); burst(['✨', '⭐'], 6, -.2); say('반짝반짝! 개운해요!'); }
  else say('조금 더 씻고 싶었는데…');
  render(); persist();
}
function rubPet(x, y) {
  const now = performance.now();
  if (now - lastRub < 45) return;
  lastRub = now;
  const b = particle('', x + rand(-16, 16), y + rand(-10, 10), 'bub');
  b.style.setProperty('--s', rand(14, 30).toFixed(0) + 'px');
  if (Math.random() < .3) sfx('bub');
  const p = P(), before = p.clean;
  change({ clean: 1.6 });
  if (before < 100 && p.clean >= 100) {
    mission('bath');
    addXP(10); change({ fun: 6 }); sfx('up'); burst(['✨', '🫧', '⭐'], 6, -.2);
    say('반짝반짝 완성! 이제 다 씻었어 버튼을 눌러 줘요', 60000);
  }
  renderHUD(); renderPet();
}
$('#bathDone').addEventListener('click', endBath);

let goingToBed = 0;
function sleep() {
  const p = P();
  if (p.energy >= 92) return say('아직 하나도 안 졸려요!');
  if (goingToBed && Date.now() - goingToBed < 8000) return;
  goingToBed = Date.now();
  say('하암… 침대로 갈래요', 3000);
  World.goSpot('bed', false, () => {
    goingToBed = 0;
    p.asleep = true; sfx('night'); mission('sleepm');
    say('잘 자요… 쿨쿨', 4000);
    render(); persist();
  });
}
function wake(auto) {
  const p = P();
  p.asleep = false;
  if (p.energy >= 60) addXP(5);
  setMood('happy', 1500);
  World.leave('bedside');
  say(auto ? '푹 잤어요! 기운이 가득해요!' : p.energy >= 60 ? '잘 잤다~ 좋은 아침!' : '으음… 조금 더 자고 싶었는데…');

}

function fs(id) {
  S.friends = S.friends || {};
  return S.friends[id] || (S.friends[id] = { pts: 0, met: false, day: '', q: 'none', qday: '', gday: '', rday: '', rcount: 0, rid: 0 });
}
const heartsOf = id => Math.min(5, Math.floor(fs(id).pts / 100));
function addFriend(id, n) {
  const before = heartsOf(id); fs(id).pts += n;
  const after = heartsOf(id);
  if (after >= 5) badge('bestie');
  if (after > before) { S.coins += 20; sfx('up'); confetti(50); toast(`${josa(FRIENDS[id].name, '과', '와')} 더 친해졌어요! ${'♥'.repeat(after)} +20코인`); }
  persist();
}
let watered = [false, false, false], starsStarted = false;
function friendAlert(id) {
  const f = fs(id);
  if (!f.met) return true;
  if (id === 'porong' && f.q === 'active' && watered.every(Boolean)) return true;
  if (id === 'banjjak' && f.q === 'active' && starsStarted && World.starsLeft() === 0) return true;
  if (id === 'neurit' && f.q === 'active' && shellsStarted && World.shellsLeft() === 0) return true;
  return false;
}

/* ---------- 대화창 ---------- */
let talking = null, typeTimer = 0, fullText = '', talkReturnFocus = null;
function typeText(t) {
  const el = $('#talkText'); clearInterval(typeTimer); fullText = t; let i = 0; el.textContent = '';
  typeTimer = setInterval(() => { i += 2; el.textContent = t.slice(0, i); if (i >= t.length) clearInterval(typeTimer); }, 28);
}
$('#talkText').addEventListener('click', () => { clearInterval(typeTimer); $('#talkText').textContent = fullText; });
function showNode(node) {
  if (!node || !talking) return closeTalk();
  typeText(node.text);
  const box = $('#talkChoices'); box.innerHTML = '';
  for (const c of node.choices || [{ label: '👋 안녕!', fn: () => null }]) {
    const b = document.createElement('button'); b.className = 'candy'; b.textContent = c.label;
    b.addEventListener('click', () => { sfx('tap'); showNode(c.fn()); });
    box.appendChild(b);
  }
  const h = heartsOf(talking);
  $('#talkHearts').textContent = '♥'.repeat(h) + '♡'.repeat(5 - h);
  $('#talkHearts').setAttribute('aria-label', `친한 정도 하트 5개 중 ${h}개`);
  box.querySelector('button')?.focus({ preventScroll: true });
}
function talkTo(id) {
  if (talking || World.hidden(id)) return;
  const f = FRIENDS[id];
  const back = document.activeElement instanceof HTMLElement && document.activeElement !== document.body ? document.activeElement : $('#world');
  World.walkToNpc(id, () => {
    if (talking) return;
    talking = id; talkReturnFocus = back; World.setTalking(id, true);
    $('#talkFace').innerHTML = `<img src="${World.portrait(id)}" alt="${f.name}">`;
    $('#talkName').textContent = f.name; $('#talkJob').textContent = f.job;
    $('#talk').hidden = false; pushBack(); sfx('pop');
    const s = fs(id);
    if (!s.met) { s.met = true; s.day = 'met'; addFriend(id, 30); if (Object.keys(FRIENDS).every(k => fs(k).met)) badge('friends8'); showNode(firstMeet(id)); }
    else showNode(menu(id, true));
    mission('talk');
  });
}
function closeTalk() {
  clearInterval(typeTimer);
  // 대화창 안에 초점이 있었을 때만 원래 자리로 돌려준다 (다른 창이 열리며 닫힌 경우는 그 창이 초점을 가져간다)
  const hadFocus = $('#talk').contains(document.activeElement);
  if (talking) World.setTalking(talking, false);
  talking = null; $('#talk').hidden = true; renderHUD();
  if (hadFocus && talkReturnFocus?.isConnected) talkReturnFocus.focus({ preventScroll: true });
  talkReturnFocus = null;
}

  const [q, a, opts] = RIDDLES[s.rid % RIDDLES.length];
  const ask = txt => ({
    text: txt,
    choices: shuffle(opts).map(o => ({ label: o, fn: () => {
      if (o !== a) { sfx('bad'); return ask(`땡! 다시 생각해 볼까? "${q}"`); }
      s.rid++; let extra = '';
      if ((s.rtotal || s.rcount || 0) < 3) { s.rtotal = (s.rtotal || s.rcount || 0) + 1; S.coins += 10; addFriend('kokkal', 15); extra = ' 상으로 10코인을 줄게!'; }
      sfx('coin'); renderHUD(); persist();
      return { text: `딩동댕! 정답은 "${a}"! 정말 똑똑하구나.${extra}`, choices: [{ label: '하나 더! 🤔', fn: riddle }, back('kokkal')] };
    } }))
  });
  return ask(`수수께끼 나갑니다~ ${q}`);
}

// 마시멜로 굽기 (루루): 꾹 누르고 있다가 노릇한 순간에 손을 뗀다
function roast() {
  closeTalk();
  const wrap = document.createElement('div'); wrap.className = 'scrim mini';
  wrap.innerHTML = `<div class="g-card roast"><h3>🔥 마시멜로 굽기</h3><p id="rHelp">버튼을 <b>꾹</b> 누르고 있다가<br>노릇노릇할 때 손을 떼요!</p>
    <div class="mallow" id="mallow"></div><div class="heat"><i id="heatBar"></i><span class="gold"></span></div>
    <p id="rCount">1번째 마시멜로 · 성공 0개</p><button class="candy primary" id="rHold">꾹 눌러서 굽기</button><p class="fine">키보드: 스페이스바를 꾹 눌렀다 떼요</p><button class="mini-quit" id="rQuit">그만하기</button></div>`;
  wrap.querySelector('.roast').setAttribute('role', 'dialog'); wrap.querySelector('.roast').setAttribute('aria-label', '마시멜로 굽기');
  const backFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  $('#app').appendChild(wrap); pushBack();
  let heat = 0, holding = false, round = 1, good = 0, timer = 0, done = false, waiting = false;
  const bar = wrap.querySelector('#heatBar'), mal = wrap.querySelector('#mallow'), btn = wrap.querySelector('#rHold');
  const color = h => h < 35 ? '#FFFFFF' : h < 60 ? '#FFF1C9' : h <= 85 ? '#E9A55A' : h < 95 ? '#9A5B2E' : '#3A2A22';
  const draw = () => { bar.style.width = heat + '%'; mal.style.background = color(heat); };
  const help = '버튼을 <b>꾹</b> 누르고 있다가<br>노릇노릇할 때 손을 떼요!';
  function release() {
    if (!holding || done) return;
    holding = false; clearInterval(timer); btn.classList.remove('on'); waiting = true;
    const nice = heat >= 60 && heat <= 85;
    if (nice) { good++; sfx('coin'); } else sfx('bad');
    wrap.querySelector('#rHelp').innerHTML = nice ? '노릇노릇! 완벽해요 😋' : heat < 60 ? '앗, 아직 덜 익었어요!' : '앗 뜨거! 너무 탔어요 🔥';
    setTimeout(() => {
      if (round >= 3) return finish();
      round++; heat = 0; draw(); waiting = false;
      wrap.querySelector('#rCount').textContent = `${round}번째 마시멜로 · 성공 ${good}개`;
      wrap.querySelector('#rHelp').innerHTML = help;
    }, 1200);
  }
  function finish() {
    done = true;
    const coins = good ? playReward('ruru', good * 5) : 0;
    addFriend('ruru', 10 + good * 5); change({ fun: 10 + good * 3 }); addXP(5 + good * 2); render();
    mission('friend');
    if (good === 3) confetti(60);
    wrap.querySelector('.roast').innerHTML = `<h3>${good === 3 ? '마시멜로 박사님!' : good ? '맛있게 구웠어요!' : '다음엔 더 잘할 수 있어!'}</h3><div class="big-score">${'🍡'.repeat(good) || '🔥'}</div><p>${good}개 성공!${good ? (coins ? ` 상으로 ${coins}코인!` : ' 코인 보상은 이미 받았어요.') : ''}</p><button class="candy primary" id="rDone">캠핑장으로 돌아가기</button>`;
    const leave = () => { closeMini(); say(pick(['루루: "냠냠, 같이 먹으니까 더 맛있다!"', '루루: "또 캠프파이어 하자!"']), 4000); };
    wrap.querySelector('#rDone').addEventListener('click', leave); wrap._close = leave;
    wrap.querySelector('#rDone').focus({ preventScroll: true });
  }
  // 중간에 그만두면 보상 없이 닫고, 언제든 다시 할 수 있다고 알려 준다
  function closeMini() { clearInterval(timer); done = true; wrap.remove(); if (backFocus?.isConnected) backFocus.focus(); else $('#world').focus({ preventScroll: true }); }
  wrap._close = () => { closeMini(); say('루루: "괜찮아! 굽고 싶을 때 또 와~"', 3000); };
  wrap.querySelector('#rQuit').addEventListener('click', () => wrap._close());
  function hold() {
    if (done || holding || waiting) return;
    holding = true; btn.classList.add('on');
    const t0 = performance.now();
    timer = setInterval(() => { heat = Math.min(100, (performance.now() - t0) / 30); draw(); if (heat >= 100) release(); }, 30);
  }
  btn.addEventListener('pointerdown', e => { e.preventDefault(); hold(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, release));
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); hold(); } });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
  wrap.addEventListener('keydown', trapTab);
  btn.focus({ preventScroll: true });
  draw();
}

function startHide() {
  if (following === 'mongsil') following = null;
  hide = { spot: Math.floor(Math.random() * 5), tries: 0 };
  World.hideStart('mongsil', hide.spot);
  say('하나, 둘, 셋... 열! 몽실이 어디 숨었을까? ❓ 덤불을 눌러 봐요', 5000);

function hideGuess(i) {
  if (i < 0) return;
  World.goToBush(i, () => {
    if (!hide) return say(pick(['덤불이 바스락거려요', '여기엔 아무도 없네~']), 2500);
    if (i === hide.spot) {
      World.hideReveal('mongsil'); hide = null; mission('friend');
      const coins = playReward('mongsil', 15); addFriend('mongsil', 30); change({ fun: 12 }); addXP(8);
      sfx('up'); confetti(50); render();
      return say(`찾았다! 몽실: "히히, 들켰다!"${coins ? ` +${coins}코인` : ''}`, 4500);
    }
    hide.tries++;
    if (hide.tries >= 3) {
      World.hideReveal('mongsil'); hide = null; mission('friend');
      const coins = playReward('mongsil', 5); addFriend('mongsil', 15); change({ fun: 8 }); render();
      return say(`몽실: "여기 있었지롱~!"${coins ? ` 같이 놀아 줘서 +${coins}코인` : ''}`, 4500);
    }
    const [tx, tz] = World.bushPos(hide.spot), [bx, bz] = World.bushPos(i), dx = tx - bx, dz = tz - bz;
    const hint = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? '더 오른쪽이야!' : '더 왼쪽이야!') : (dz < 0 ? '더 위쪽이야!' : '더 아래쪽이야!');
    sfx('bad'); say(`여기 없네! 몽실 목소리: "${hint}" (남은 기회 ${3 - hide.tries}번)`, 4500);
  });
}

// 달리기 시합 (반짝): 꽃언덕 트랙에서 버튼 연타로 달리기
function startRace() {
  const p = P();
  if (p.energy < 20) return say('반짝: "너 너무 졸려 보여! 푹 자고 와서 시합하자!"', 4000);
  if (following === 'banjjak') following = null;
  closeTalk();
  const ui = document.createElement('div'); ui.className = 'race-ui';
  ui.innerHTML = '<div class="race-count" id="rcCount"></div><p class="race-tip">신호가 울리면 버튼을 빠르게 연타! (키보드: 스페이스바)</p><button class="race-btn" id="rcBtn" disabled>달려!<br>🏃</button>';
  room.appendChild(ui);
  const cnt = ui.querySelector('#rcCount'), btn = ui.querySelector('#rcBtn');
  const tap = () => { World.raceTap(); sfx('tap'); btn.classList.add('on'); setTimeout(() => btn.classList.remove('on'), 70); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); tap(); } });
  let cancelled = false;
  ui._close = () => { cancelled = true; World.raceCancel(); ui.remove(); say('반짝: "괜찮아! 달리고 싶을 때 또 말해 줘!"', 3500); renderHUD(); };
  World.raceStart('banjjak', win => {
    if (cancelled) return;
    ui.remove();
    change({ fun: win ? 15 : 10, energy: -8 }); mission('friend');
    if (win) { badge('racer'); const coins = playReward('banjjak', 20); addFriend('banjjak', 30); addXP(10); confetti(80); sfx('up'); say(`1등! 반짝: "우와, 너 엄청 빠르다!"${coins ? ` +${coins}코인` : ''}`, 5000); }
    else { const coins = playReward('banjjak', 5); addFriend('banjjak', 15); addXP(5); sfx('coin'); say(`아깝다! 반짝: "다음엔 네가 이길 것 같아!"${coins ? ` +${coins}코인` : ''}`, 5000); }
    render();
  });
  let k = 3;
  const tick = () => {
    if (cancelled) return;
    if (k > 0) { cnt.textContent = k; sfx('pop'); k--; setTimeout(tick, 1000); }
    else if (!cancelled) { cnt.textContent = '출발!'; sfx('up'); btn.disabled = false; btn.focus({ preventScroll: true }); setTimeout(() => { cnt.textContent = ''; }, 800); }
  };
  setTimeout(tick, 420);

function seeded(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return () => ((h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0) / 4294967296); }
function todayMissions() {

  const prev = localStorage.getItem(SAVE_KEY);
  localStorage.setItem(SAVE_KEY + '-before-restore', prev || JSON.stringify(S));
  try {
    d.lastTick = Date.now(); const json = JSON.stringify(d);
    localStorage.setItem(SAVE_KEY, json);

    localStorage.setItem(RESTORE_NOTE_KEY, JSON.stringify({ pets: d.pets.length, coins: d.coins }));

const PHOTO_KEY = 'malang-pet-house-photos', PHOTO_MAX = 12;
function loadPhotos() { try { const a = JSON.parse(localStorage.getItem(PHOTO_KEY) || '[]'); return Array.isArray(a) ? a.filter(x => x && typeof x.d === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(x.d)) : []; } catch (e) { return []; } }

function framePhoto(src, sw, sh, bg) {
  const W = 480, ih = Math.round(W * Math.min(1.1, sh / sw)), pad = 16, foot = 58;
  const c = document.createElement('canvas'); c.width = W + pad * 2; c.height = ih + pad + foot;
  const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = bg || '#BFE8FF'; x.fillRect(pad, pad, W, ih);
  const scale = Math.max(W / sw, ih / sh), dw = sw * scale, dh = sh * scale;
  x.drawImage(src, pad + (W - dw) / 2, pad + (ih - dh) / 2, dw, dh);
  const p = P(), d = new Date();
  x.fillStyle = INK; x.font = `24px ${getComputedStyle(document.body).getPropertyValue('--display') || 'sans-serif'}`; x.textBaseline = 'middle';
  x.fillText(`${p.name} · Lv.${p.level}${p.title ? ' · ' + titleName(p.title) : ''}`, pad + 4, ih + pad + foot / 2);
  x.font = '15px sans-serif'; x.textAlign = 'right'; x.fillStyle = '#8E7A85';
  x.fillText(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, c.width - pad - 4, ih + pad + foot / 2);
  return c.toDataURL('image/jpeg', .82);
}
function takePhoto() {
  const p = P(); if (!p || !p.hatched) return;
  const list = loadPhotos();
  if (list.length >= PHOTO_MAX) { toast(`앨범이 가득 찼어요 (${PHOTO_MAX}장). 지울 사진을 골라 주세요`); return openAlbum(); }
  const keep = dataUrl => {
    if (!dataUrl) return toast('이 기기에서는 사진을 찍을 수 없어요');
    list.push({ d: dataUrl, t: Date.now() });
    if (!savePhotos(list)) return toast('저장 공간이 모자라요. 앨범에서 사진을 지워 주세요');
    retrigger($('#flash'), 'go'); sfx('pop'); setMood('happy', 1500); World.trick('hop');
    say(pick(['찰칵! 예쁘게 나왔어요?', '브이~ ✌️ 잘 찍었다!', '앨범에 넣어 줘서 고마워!']), 3000);
    toast(`📷 찰칵! 앨범에 저장했어요 (${list.length}/${PHOTO_MAX})`);
  };
  const shot = World.snapshot();
  if (shot) { try { return keep(framePhoto(shot, shot.width, shot.height, '#BFE8FF')); } catch (e) { return keep(null); } }
  // 3D를 못 쓰는 기기: 2D 그림으로 찍는다
  const img = new Image();
  img.onload = () => { try { keep(framePhoto(img, 200, 200, (SPECIES[p.sp] || {}).bg)); } catch (e) { keep(null); } };
  img.onerror = () => keep(null);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(petSVG(p.sp, { mood: 'happy', stage: stageOf(p.level), hat: p.hat }));
}

function goQuest() {
  const q = STORY[S.story.i]; if (!q) return;
  if (!q.go) return say(q.hint || '조금만 더 힘내요!', 3500);
  if (talking) closeTalk();
  const area = World.area(), g = q.go;
  if (area === 'obby') return;
  if (g === 'pet') return say('나를 톡톡 눌러서 쓰다듬어 줘!', 3000);
  if (g === 'shop') return openShop('decor');
  if (g === 'cook') return openCook();
  if (g === 'feed') return area === 'house' ? openFeed() : World.goHome(openFeed);
  if (g === 'bath') return area === 'house' ? startBath() : World.goHome(startBath);
  if (g === 'door') return area === 'house' ? goOutside() : say('벌써 마을에 나왔어요!', 2000);
  if (area !== 'village') { pendingQuest = true; return goOutside(); }
  if (g === 'garden') return World.goVillage('garden', true, () => say('밭을 눌러서 씨앗을 심거나 물을 줘요!', 3000));
  if (g === 'portal') return World.goVillage('portal', true, startObby);
  talkTo(questNpc(g));
}
$('#questBtn').addEventListener('click', () => {
  sfx('tap');
  if (!STORY[S.story.i]) { S.story.doneSeen = true; persist(); return renderHUD(); }
  goQuest();
});

/* ---------- 계절 축제 (지금은 할로윈): 기간 안에 아무 때나 사탕을 찾고, 선물은 상점에서도 살 수 있다 ---------- */
const SEASON = (() => {
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  return (m === 10 && day >= 15) || (m === 11 && day <= 7) ? { id: 'halloween', year: d.getFullYear(), name: '할로윈 축제' } : null;
})();
const CANDY_SPOTS = [[-3, 4.2], [4.6, -4.8], [-11.6, -2.6], [5.6, 9.2], [-5.5, 10.5], [9.5, 12], [18, -.6], [23, 8.5], [14.5, 4], [-9, -4.5], [1.5, 7], [11, -1.6]];
const SEASON_SHOP = [{ kind: 'decor', id: 'jack', name: '호박 등불', e: '🎃', cost: 6 }, { kind: 'hat', id: 'witch', name: '마녀 모자', e: '🧙', cost: 12 }];
// 모은 사탕(candy)은 날짜·연도·축제가 바뀌어도 그대로 남는다. 새 축제에서 새로 생기는 건 '사탕이 숨은 자리'뿐이다.
// 저장 형식은 예전 그대로 S.season = { id, candy, found } 이고 year만 더한다.
function seasonState() {
  const old = S.season;
  if (!SEASON) return old && old.candy > 0 ? old : null;            // 축제 기간이 아니어도 남은 사탕은 언제든 쓸 수 있다
  if (!old) return (S.season = { id: SEASON.id, year: SEASON.year, candy: 0, found: [] });
  // 예전 저장본은 id가 'halloween2026'처럼 연도를 품고 있다. 올해 것이면 찾은 자리를 그대로 지킨다
  const oldYear = old.year ?? (+(String(old.id || '').match(/\d{4}$/) || [])[0] || null);
  const sameRound = String(old.id || '').startsWith(SEASON.id) && oldYear === SEASON.year;
  if (!sameRound || !Array.isArray(old.found)) old.found = [];
  old.id = SEASON.id; old.year = SEASON.year; old.candy = Math.max(0, +old.candy || 0);
  return old;
}
function spawnCandies() {
  const ev = SEASON && seasonState(); if (!ev) return;
  World.spawnCandies(CANDY_SPOTS.map((c, i) => [i, c[0], c[1]]).filter(c => !ev.found.includes(c[0])), i => {
    if (ev.found.includes(i)) return;
    ev.found.push(i); ev.candy++; sfx('coin');
    toast(`🍬 사탕 ${ev.found.length}/${CANDY_SPOTS.length}`);
    if (ev.found.length >= CANDY_SPOTS.length) { badge('season'); say('사탕을 모두 찾았어요! 📋 목표 화면의 🎃 탭에서 선물로 바꿔요', 5000); }
    renderHUD(); persist();
  });
}
function openSeason() {
  const ev = seasonState(); if (!ev) return openMissions('m');
  const owned = it => it.kind === 'hat' ? S.hats.includes(it.id) : decorState().owned.includes(it.id);
  const cards = SEASON_SHOP.map((it, i) => `<button class="item${owned(it) ? ' on' : ''}" data-sz="${i}"${owned(it) ? ' disabled' : ''}><span class="em">${it.e}</span><span class="nm">${it.name}</span><span class="pr">${owned(it) ? '받음 ✓' : `🍬 ${it.cost}개`}</span></button>`).join('');
  const intro = SEASON
    ? '마을 곳곳에 숨은 사탕을 찾아 선물로 바꿔요. 다 못 찾아도 괜찮아요. 모은 사탕은 축제가 끝나도 없어지지 않고, 선물은 상점에서 코인으로도 살 수 있어요.'
    : '축제는 쉬는 중이에요. 모아 둔 사탕은 그대로 있으니 언제든 선물로 바꿔요. 선물은 상점에서 코인으로도 살 수 있어요.';
  openSheet(SEASON ? '🎃 할로윈 축제' : '🍬 모아 둔 사탕', `${missionTabs('e')}<p class="msub">${intro}</p><div class="ev-head"><span class="pill">🍬 ${ev.candy}</span>${SEASON ? `<span>올해 찾은 사탕 ${ev.found.length} / ${CANDY_SPOTS.length}</span>` : ''}</div><div class="grid">${cards}</div>`,
    body => body.addEventListener('click', e => {
      const tb = e.target.closest('[data-mtab]'); if (tb) return openMissions(tb.dataset.mtab);
      const b = e.target.closest('[data-sz]'); if (!b) return;
      const it = SEASON_SHOP[+b.dataset.sz];
      if (owned(it)) return;
      if (ev.candy < it.cost) return toast(SEASON ? `사탕이 ${it.cost - ev.candy}개 더 필요해요. 마을을 둘러봐요!` : `사탕이 ${it.cost - ev.candy}개 모자라요. 상점에서 코인으로도 살 수 있어요`);
      ev.candy -= it.cost;
      if (it.kind === 'hat') S.hats.push(it.id); else decorState().owned.push(it.id);
      sfx('buy'); confetti(50); toast(`${it.e} ${josa(it.name, '을', '를')} 받았어요! 상점에서 쓰거나 놓을 수 있어요`);
      persist(); render(); openSeason();
    }));
}

/* ---------- 성장길: 놀수록 쌓이는 점수로 20칸을 간다. 날짜와 상관없고 만료도 없으며 끝이 있다 ----------
   저장: S.pass = { pts: 점수, got: 받은 칸 수 }. 쓰다듬기처럼 아주 작은 경험치는 세지 않아 한 가지만 반복해서 채우기 어렵다 */
const PASS_STEP = 40;
const PASS = [
  { coins: 15 }, { coins: 20 }, { coins: 25 }, { coins: 30 }, { wear: 'fairy' },
  { coins: 30 }, { coins: 35 }, { coins: 40 }, { coins: 45 }, { wear: 'star' },
  { coins: 50 }, { coins: 50 }, { coins: 55 }, { coins: 60 }, { ride: 'rainbow' },
  { coins: 60 }, { coins: 65 }, { coins: 70 }, { coins: 80 }, { coins: 150, badge: 'passDone' }
];
function passState() {
  // 이미 많이 키운 펫은 그만큼 앞에서 시작한다 (최대 10칸)
  if (!S.pass) S.pass = { pts: Math.min(PASS_STEP * 10, S.pets.reduce((a, q) => a + (q.level - 1) * 20, 0)), got: 0 };
  return S.pass;
}
const passReached = () => Math.min(PASS.length, Math.floor(passState().pts / PASS_STEP));
const passReady = () => passReached() - passState().got;
function passAdd(n) {
  if (n < 3) return;
  const before = passReached(); passState().pts += n; const now = passReached();

const passLabel = r => r.wear ? `${WEAR[r.wear].e} ${WEAR[r.wear].name}` : r.ride ? `${RIDES[r.ride].e} ${RIDES[r.ride].name}` : `${r.coins}코인${r.badge ? ' + 칭호 말랑 전설' : ''}`;
function claimPass() {
  const st = passState(); if (st.got >= passReached()) return;
  const r = PASS[st.got]; st.got++;

  if (r.wear) { S.wear = S.wear || []; if (!S.wear.includes(r.wear)) S.wear.push(r.wear); }
  if (r.ride) { S.rides = S.rides || []; if (!S.rides.includes(r.ride)) S.rides.push(r.ride); S.rideSel = r.ride; }
  if (r.badge) badge(r.badge);

}

  }).join('');

function trapTab(e) {
  if (e.key !== 'Tab') return;
  const items = [...e.currentTarget.querySelectorAll('button:not(:disabled), input:not(:disabled), [tabindex="0"]')].filter(el => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

  return false;
}
